# Hebraico Fluente em inglês - o segundo Worker (PLANO-INGLES.md).
#
# O mesmo código de worker/src e o MESMO banco D1 do site brasileiro: uma
# conta criada num site entra no outro, e o curso comprado vale nos dois. O
# que muda é o export servido (app/out-en, a build com NEXT_PUBLIC_LOCALE=en)
# e as variáveis abaixo.
#
# AINDA NÃO SE PUBLICA. Falta o domínio em inglês (decisão do dono): com ele,
# entram as `routes`, o SITE_ORIGIN e o EMAIL_FROM, e a publicação ganha um
# passo próprio no deploy-worker.yml. Até lá, nada aqui vai ao ar.
#
# Montar à mão, para conferir:
#   cd app && NEXT_PUBLIC_LOCALE=en npm run build      # gera app/out-en
#   npx wrangler dev -c wrangler.en.toml --local

name = "hebraico-fluente-en"
main = "worker/src/worker.js"
compatibility_date = "2026-09-01"

# Sem domínio ainda: só o workers.dev, para conferência. Quando o domínio
# entrar, as `routes` vêm para cá (como no wrangler.toml) e esta linha volta
# para false, pelo mesmo motivo de lá (as regras da zona não valem no
# workers.dev).
workers_dev = true

[assets]
directory = "./app/out-en"
binding = "ASSETS"
# A mesma lista do wrangler.toml, pelos mesmos motivos (ver lá). Mudou lá,
# muda aqui: tests/i18n.test.ts confere as duas.
run_worker_first = [
  "/*",
  "!/_next/static/*",
  "!/fonts/*",
  "!/media/*",
  "!/tracado-amostra/*"
]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "hebraico-fluente"
database_id = "af5fad4b-8a1d-4512-8024-f13d698ddd73"

# SEM [triggers], de propósito: a varredura, os alertas e a faxina rodam no
# Worker brasileiro, sobre o mesmo banco. Dois agendamentos no mesmo banco só
# dobrariam o trabalho (a trava `varredura` seguraria, mas à toa). O webhook
# do Paddle (etapa 5) entra como rota, não como agendamento.

[vars]
# O idioma do site. O Worker lê para escolher a língua do que ele mesmo
# escreve (e-mails, páginas de erro); ver PLANO-INGLES.md, etapa 1.
LOCALE = "en"
# Pendentes do domínio em inglês. Sem eles o Worker não manda e-mail nem
# monta link absoluto, e é por isso que este arquivo ainda não se publica.
# SITE_ORIGIN = "https://<dominio-em-ingles>"
# EMAIL_FROM = "<Marca> <contact@<dominio-em-ingles>>"
SUPPORT_EMAIL = "contato@hebraicofluente.com.br"
ADMIN_EMAILS = "languageswithmoshik@gmail.com"
