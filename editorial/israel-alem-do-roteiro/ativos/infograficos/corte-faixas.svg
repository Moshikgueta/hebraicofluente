<svg class="fig-corte-faixas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Corte esquemático de oeste a leste: Mediterrâneo, planície costeira, montanhas e o vale da fenda com o Mar Morto abaixo do nível do mar">
  <style>
.fig-corte-faixas .l{font-family:'Instrument Sans',sans-serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.fig-corte-faixas .t{font-family:'Literata',serif}
.fig-corte-faixas .n{font-family:'Instrument Sans',sans-serif}
.fig-corte-faixas .a{font-family:'Bricolage Grotesque',sans-serif;font-weight:700}</style>
  <defs><linearGradient id="corte-faixas--terra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2B07A"/><stop offset=".45" stop-color="#B9773E"/><stop offset="1" stop-color="#5E3A1E"/></linearGradient>
  <linearGradient id="corte-faixas--mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B8C97"/><stop offset="1" stop-color="#1E5A73"/></linearGradient>
  <linearGradient id="corte-faixas--ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2A31"/><stop offset="1" stop-color="#155059"/></linearGradient></defs>
  <rect width="900" height="1200" fill="url(#corte-faixas--ceu)"/>
  <rect x="0" y="760" width="160" height="440" fill="url(#corte-faixas--mar)"/>
  <rect x="640" y="910" width="140" height="290" fill="url(#corte-faixas--mar)"/>
  <path d="M0,930 L110,820 L150,752 L300,720 C360,690 380,530 430,460 C460,415 480,430 505,460 C540,510 560,650 600,820 C620,910 640,965 660,975 L760,975 C790,960 805,820 830,640 C850,530 880,500 900,495 L900,1200 L0,1200 Z" fill="url(#corte-faixas--terra)"/>
  <path d="M0,930 L110,820 L150,752 L300,720 C360,690 380,530 430,460 C460,415 480,430 505,460 C540,510 560,650 600,820 C620,910 640,965 660,975 L760,975 C790,960 805,820 830,640 C850,530 880,500 900,495" fill="none" stroke="#FBF3E2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="0" x2="900" y1="760" y2="760" stroke="#E9DCC0" stroke-width="1.6" stroke-dasharray="7 8" opacity=".85"/>
  <text class="l" x="878" y="748" text-anchor="end" font-size="15" fill="#E9DCC0">nível do mar</text><text class="l" x="18" y="696" text-anchor="start" font-size="17" fill="#FFFFFF">Mediterrâneo</text><text class="n" x="18" y="722" text-anchor="start" font-size="18" fill="#E9DCC0">a oeste</text><line x1="220" x2="220" y1="730" y2="610" stroke="#E9DCC0" stroke-width="1.2" opacity=".7"/><text class="l" x="150" y="564" text-anchor="start" font-size="17" fill="#FFFFFF">Planície costeira</text><text class="n" x="150" y="590" text-anchor="start" font-size="18" fill="#E9DCC0">até ~40 km para o interior</text><line x1="478" x2="540" y1="442" y2="400" stroke="#E9DCC0" stroke-width="1.2" opacity=".7"/><text class="l" x="548" y="368" text-anchor="start" font-size="17" fill="#FFFFFF">Montanhas</text><text class="n" x="548" y="394" text-anchor="start" font-size="18" fill="#E9DCC0">na Galileia, de 500 a 1.200 m</text><line x1="710" x2="710" y1="920" y2="694" stroke="#E9DCC0" stroke-width="1.2" opacity=".7"/><text class="l" x="710" y="632" text-anchor="middle" font-size="17" fill="#FFFFFF">Vale da fenda</text><text class="n" x="710" y="658" text-anchor="middle" font-size="18" fill="#E9DCC0">o Mar Morto</text><text class="a" x="710" y="1060" text-anchor="middle" font-size="52" fill="#F7EFDF">-430 m</text><text class="n" x="710" y="1092" text-anchor="middle" font-size="17" fill="#E9DCC0">em 2022, a superfície já estava abaixo disso</text></svg>