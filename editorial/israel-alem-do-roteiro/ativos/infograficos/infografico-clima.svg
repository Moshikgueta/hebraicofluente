"middle" style="fill:#fff">nov</text><rect x="570" y="134" width="40" height="52" rx="6" fill="#1F8A7D" stroke="#E4E0D6"/><text class="t mes" x="590" y="165" text-anchor="middle" style="fill:#fff">dez</text><rect x="340" y="222" width="14" height="10" rx="2" fill="#1F8A7D"/><text class="t peq" x="360" y="231">estação chuvosa: novembro a março</text>
    <rect x="340" y="242" width="14" height="10" rx="2" fill="#E9D3A6"/><text class="t peq" x="360" y="251">em geral sem chuva: junho a agosto</text>
