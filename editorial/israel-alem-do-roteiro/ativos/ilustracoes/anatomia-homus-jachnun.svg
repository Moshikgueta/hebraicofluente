<svg class="fig-anatomia-homus-jachnun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1060" role="img" aria-label="Anatomia, em desenho: o homus leva grão-de-bico cozido e amassado, tahine, alho e suco de limão; o jachnun é massa enrolada assada a noite inteira, servida em Israel com tomate ralado, zhug e ovo."><style>
.fig-anatomia-homus-jachnun .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-anatomia-homus-jachnun .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-anatomia-homus-jachnun .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-anatomia-homus-jachnun .he{font-family:'Noto Serif Hebrew',serif}
.fig-anatomia-homus-jachnun .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="anatomia-homus-jachnun--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
