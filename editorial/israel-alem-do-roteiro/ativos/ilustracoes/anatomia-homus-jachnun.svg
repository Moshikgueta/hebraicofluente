  </pattern>
  <pattern id="anatomia-homus-jachnun--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="anatomia-homus-jachnun--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1060" fill="#FBF9F5"/><rect width="1080" height="140" fill="#0E3B43"/><text class="t" x="56" y="58" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">ANATOMIA DA MESA</text><text class="d" x="56" y="112" font-size="42" fill="#FFFFFF">O homus e o jachnun, por partes</text><line x1="540" x2="540" y1="190" y2="920" stroke="#E4E0D6" stroke-width="2"/><text class="d" x="280" y="210" font-size="34" text-anchor="middle" fill="#0E3B43">Homus</text><text class="he" x="280" y="252" font-size="28" fill="#8A6520" direction="rtl" unicode-bidi="embed" text-anchor="middle">חוּמוּס</text><circle cx="108" cy="336" r="13" fill="#F7EFDF" stroke="#8A6520" stroke-width="2"/><circle cx="130" cy="318" r="13" fill="#F7EFDF" stroke="#8A6520" stroke-width="2"/><circle cx="152" cy="336" r="13" fill="#F7EFDF" stroke="#8A6520" stroke-width="2"/><circle cx="120" cy="352" r="13" fill="#F7EFDF" stroke="#8A6520" stroke-width="2"/><circle cx="142" cy="352" r="13" fill="#F7EFDF" stroke="#8A6520" stroke-width="2"/><circle cx="130" cy="334" r="13" fill="#F7EFDF" stroke="#8A6520" stroke-width="2"/><text class="t" x="130" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0E3B43">grão-de-bico</text><path d="M205 300 h50 v58 q0 10 -10 10 h-30 q-10 0 -10 -10z" fill="#E9DCC0" stroke="#8C5426" stroke-width="2.5"/><rect x="201" y="290" width="58" height="14" rx="4" fill="#D9CCB0"/><text class="t" x="230" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0E3B43">tahine</text><path d="M330 300 q28 10 26 40 q-4 28 -26 30 q-22 -2 -26 -30 q-2 -30 26 -40z" fill="#FFFFFF" stroke="#D9CCB0" stroke-width="2.5"/><path d="M330 300 v-14" stroke="#6B7444" stroke-width="4" stroke-linecap="round"/><path d="M330 312 v52" stroke="#E4E0D6" stroke-width="2"/><text class="t" x="330" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0E3B43">alho</text><ellipse cx="430" cy="335" rx="32" ry="26" fill="#B8862F" opacity=".85"/><ellipse cx="430" cy="335" rx="22" ry="17" fill="#F7EFDF"/><line x1="430" y1="335" x2="450.0" y2="335.0" stroke="#B8862F" stroke-width="1.6"/><line x1="430" y1="335" x2="440.0" y2="348.0" stroke="#B8862F" stroke-width="1.6"/><line x1="430" y1="335" x2="419.9" y2="347.9" stroke="#B8862F" stroke-width="1.6"/><line x1="430" y1="335" x2="410.0" y2="334.9" stroke="#B8862F" stroke-width="1.6"/><line x1="430" y1="335" x2="420.2" y2="321.9" stroke="#B8862F" stroke-width="1.6"/><line x1="430" y1="335" x2="440.2" y2="322.1" stroke="#B8862F" stroke-width="1.6"/><text class="t" x="430" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0E3B43">limão</text><text class="t" x="430" y="425" font-size="13" text-anchor="middle" fill="#5F6A66">(o suco)</text><path d="M280 450 v60" stroke="#B9773E" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#anatomia-homus-jachnun--ponta)"/><ellipse cx="288" cy="650" rx="200" ry="110" fill="#D9CCB0"/><ellipse cx="280" cy="640" rx="200" ry="110" fill="#FFFFFF" stroke="#1E5A73" stroke-width="4"/><ellipse cx="280" cy="630" rx="160" ry="80" fill="#E9DCC0"/><ellipse cx="280" cy="630" rx="110" ry="50" fill="none" stroke="#D9CCB0" stroke-width="8"/><ellipse cx="280" cy="630" rx="56" ry="24" fill="#B8862F" opacity=".5"/><text class="t" x="280" y="800" font-size="17" text-anchor="middle" fill="#2E3633">Grão-de-bico cozido e amassado,</text><text class="t" x="280" y="824" font-size="17" text-anchor="middle" fill="#2E3633">misturado com tahine, alho</text><text class="t" x="280" y="848" font-size="17" text-anchor="middle" fill="#2E3633">e suco de limão.</text><text class="t" x="280" y="884" font-size="14.5" text-anchor="middle" font-style="italic" fill="#5F6A66">Tahine: o condimento de gergelim tostado.</text><text class="d" x="800" y="210" font-size="34" text-anchor="middle" fill="#0E3B43">Jachnun</text><text class="t" x="800" y="246" font-size="16" text-anchor="middle" fill="#5F6A66">o pão da manhã de sábado</text><path d="M670 306 h220 a34 34 0 0 1 0 68 h-220 a34 34 0 0 1 0 -68z" transform="translate(5 7)" fill="#D9CCB0"/><path d="M670 306 h220 a34 34 0 0 1 0 68 h-220 a34 34 0 0 1 0 -68z" fill="#B8862F"/><path d="M700 308 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M740 308 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M780 308 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M820 308 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M860 308 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><circle cx="890" cy="340" r="26" fill="#F7EFDF" stroke="#8A6520" stroke-width="2.5"/><path d="M890 340 m-4 0 a4 4 0 1 1 8 0 a9 9 0 1 1 -18 0 a14 14 0 1 1 28 0" fill="none" stroke="#8A6520" stroke-width="2"/><path d="M690 386 h220 a34 34 0 0 1 0 68 h-220 a34 34 0 0 1 0 -68z" transform="translate(5 7)" fill="#D9CCB0"/><path d="M690 386 h220 a34 34 0 0 1 0 68 h-220 a34 34 0 0 1 0 -68z" fill="#B8862F"/><path d="M720 388 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M760 388 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M800 388 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M840 388 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><path d="M880 388 q-14 32 0 64" fill="none" stroke="#8A6520" stroke-width="2.5"/><circle cx="910" cy="420" r="26" fill="#F7EFDF" stroke="#8A6520" stroke-width="2.5"/><path d="M910 420 m-4 0 a4 4 0 1 1 8 0 a9 9 0 1 1 -18 0 a14 14 0 1 1 28 0" fill="none" stroke="#8A6520" stroke-width="2"/><path d="M620 570 h100 q0 50 -50 50 q-50 0 -50 -50z" fill="#D9CCB0" transform="translate(4 5)"/><path d="M620 570 h100 q0 50 -50 50 q-50 0 -50 -50z" fill="#FFFFFF" stroke="#1E5A73" stroke-width="3"/><ellipse cx="670" cy="570" rx="50" ry="13" fill="#B9773E"/><text class="t" x="670" y="656" font-size="16" font-weight="700" text-anchor="middle" fill="#0E3B43">tomate ralado</text><path d="M750 570 h100 q0 50 -50 50 q-50 0 -50 -50z" fill="#D9CCB0" transform="translate(4 5)"/><path d="M750 570 h100 q0 50 -50 50 q-50 0 -50 -50z" fill="#FFFFFF" stroke="#1E5A73" stroke-width="3"/><ellipse cx="800" cy="570" rx="50" ry="13" fill="#6B7444"/><text class="t" x="800" y="656" font-size="16" font-weight="700" text-anchor="middle" fill="#0E3B43">zhug</text><ellipse cx="934" cy="592" rx="36" ry="46" fill="#D9CCB0"/><ellipse cx="930" cy="586" rx="36" ry="46" fill="#E9DCC0" stroke="#8C5426" stroke-width="2.5"/><text class="t" x="930" y="656" font-size="16" font-weight="700" text-anchor="middle" fill="#0E3B43">ovo</text><text class="t" x="800" y="730" font-size="17" text-anchor="middle" fill="#2E3633">Massa fina, amanteigada e enrolada,</text><text class="t" x="800" y="754" font-size="17" text-anchor="middle" fill="#2E3633">que assa devagar durante a noite.</text><text class="t" x="800" y="790" font-size="17" text-anchor="middle" fill="#2E3633">Em Israel, vem com tomate ralado,</text><text class="t" x="800" y="814" font-size="17" text-anchor="middle" fill="#2E3633">zhug (molho picante iemenita) e ovo.</text><text class="t" x="800" y="850" font-size="14.5" text-anchor="middle" font-style="italic" fill="#5F6A66">Associado aos judeus do Iêmen, em especial de Aden.</text><rect x="56" y="945" width="968" height="48" rx="10" fill="#F7EFDF"/><text class="t" x="76" y="976" font-size="15" fill="#8C5426">A receita tradicional, segundo as obras de referência; cada casa tem a sua medida.</text><text class="t" x="56" y="1048" font-size="12.5" fill="#5F6A66">Desenho esquemático. Fontes: Encyclopaedia Britannica e Dictionary.com (homus); My Jewish Learning e Hadassah (jachnun).</text></g></svg>