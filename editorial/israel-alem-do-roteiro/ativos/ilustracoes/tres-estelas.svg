7D6" stroke-width="3" stroke-linecap="round" opacity=".55"/><line x1="800" x2="950" y1="585" y2="585" stroke="#EFE7D6" stroke-width="3" stroke-linecap="round" opacity=".55"/><text class="t" x="80" y="668" font-size="22" font-weight="700" fill="#0E3B43">Merneptah</text><text class="n" x="80" y="698" font-size="20" fill="#8C5426">c. 1207 a.C.</text><text class="t" x="80" y="736" font-size="16.5" fill="#2E3633">O nome Israel num texto</text><text class="t" x="80" y="761" font-size="16.5" fill="#2E3633">egípcio.</text><text class="t" x="80" y="786" font-size="16.5" fill="#12665C">Museu Egípcio do Cairo</text><text class="t" x="410" y="668" font-size="22" font-weight="700" fill="#0E3B43">Mesha</text><text class="n" x="410" y="698" font-size="20" fill="#8C5426">pouco depois de 842 a.C.</text><text class="t" x="410" y="736" font-size="16.5" fill="#2E3633">Basalto, cerca de 1,25 m,</text><text class="t" x="410" y="761" font-size="16.5" fill="#2E3633">34 linhas em moabita.</text><text class="t" x="410" y="786" font-size="16.5" fill="#12665C">Louvre, Paris</text><text class="t" x="760" y="668" font-size="22" font-weight="700" fill="#0E3B43">Tel Dan</text><text class="n" x="760" y="698" font-size="20" fill="#8C5426">século IX a.C.</text><text class="t" x="760" y="736" font-size="16.5" fill="#2E3633">Aramaico; a sequência bytdwd,</text><text class="t" x="760" y="761" font-size="16.5" fill="#2E3633">"casa de Davi" para a maioria.</text><text class="t" x="760" y="786" font-size="16.5" fill="#12665C">Museu de Israel, Jerusalém</text><line x1="56" x2="1024" y1="926" y2="926" stroke="#E4E0D6"/><text class="t" x="56" y="954" font-size="12.5" fill="#5F6A66">Silhuetas esquemáticas, fora de escala e sem proporção entre si: só a altura da estela de Mesha vem da fonte (Louvre).</text><text class="t" x="56" y="974" font-size="12.5" fill="#5F6A66">Fontes: Museu Egípcio do Cairo, Louvre e Museu de Israel, pelos registros do capítulo 2. Hebraico Fluente · Israel Além do Roteiro</text></g></sv