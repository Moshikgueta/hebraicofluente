<svg class="fig-feriados-israel-brasil" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1240" role="img" aria-label="Comparação: os nove dias de descanso oficiais de Israel, que mudam de data todo ano, e os nove feriados nacionais fixados pelas leis federais do Brasil, sempre na mesma data."><style>
.fig-feriados-israel-brasil .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-feriados-israel-brasil .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-feriados-israel-brasil .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-feriados-israel-brasil .he{font-family:'Noto Serif Hebrew',serif}
.fig-feriados-israel-brasil .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="feriados-israel-brasil--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="feriados-israel-brasil--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="feriados-israel-brasil--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="feriados-israel-brasil--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1240" fill="#FBF9F5"/><rect width="1080" height="190" fill="#0E3B43"/><text class="t" x="56" y="62" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">ISRAEL X BRASIL</text><text class="d" x="56" y="118" font-size="42" fill="#FFFFFF">Nove dias de folga por lei,</text><text class="d" x="56" y="164" font-size="42" fill="#B8862F">de cada lado</text><rect x="56" y="230" width="460" height="830" rx="18" fill="#1F8A7D" opacity=".14"/><text class="d" x="84" y="280" font-size="34" fill="#0E3B43">Israel</text><text class="t" x="84" y="312" font-size="15" fill="#5F6A66">seguem o calendário judaico:</text><text class="t" x="84" y="332" font-size="15" fill="#5F6A66">mudam de data todo ano</text><circle cx="102" cy="392" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="398" font-size="17" text-anchor="middle" fill="#FFFFFF">1</text><text class="t" x="134" y="390" font-size="18" font-weight="700" fill="#0E3B43">Rosh Hashaná</text><text class="t" x="134" y="412" font-size="15" fill="#2E3633">dia 1, o ano-novo</text><circle cx="102" cy="464" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="470" font-size="17" text-anchor="middle" fill="#FFFFFF">2</text><text class="t" x="134" y="462" font-size="18" font-weight="700" fill="#0E3B43">Rosh Hashaná</text><text class="t" x="134" y="484" font-size="15" fill="#2E3633">dia 2</text><circle cx="102" cy="536" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="542" font-size="17" text-anchor="middle" fill="#FFFFFF">3</text><text class="t" x="134" y="534" font-size="18" font-weight="700" fill="#0E3B43">Yom Kipur</text><text class="t" x="134" y="556" font-size="15" fill="#2E3633">o Dia da Expiação</text><circle cx="102" cy="608" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="614" font-size="17" text-anchor="middle" fill="#FFFFFF">4</text><text class="t" x="134" y="606" font-size="18" font-weight="700" fill="#0E3B43">Sucot</text><text class="t" x="134" y="628" font-size="15" fill="#2E3633">o primeiro dia</text><circle cx="102" cy="680" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="686" font-size="17" text-anchor="middle" fill="#FFFFFF">5</text><text class="t" x="134" y="678" font-size="18" font-weight="700" fill="#0E3B43">Sucot</text><text class="t" x="134" y="700" font-size="15" fill="#2E3633">o oitavo dia</text><circle cx="102" cy="752" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="758" font-size="17" text-anchor="middle" fill="#FFFFFF">6</text><text class="t" x="134" y="750" font-size="18" font-weight="700" fill="#0E3B43">Pêssach</text><text class="t" x="134" y="772" font-size="15" fill="#2E3633">o primeiro dia</text><circle cx="102" cy="824" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="830" font-size="17" text-anchor="middle" fill="#FFFFFF">7</text><text class="t" x="134" y="822" font-size="18" font-weight="700" fill="#0E3B43">Pêssach</text><text class="t" x="134" y="844" font-size="15" fill="#2E3633">o sétimo dia</text><circle cx="102" cy="896" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="902" font-size="17" text-anchor="middle" fill="#FFFFFF">8</text><text class="t" x="134" y="894" font-size="18" font-weight="700" fill="#0E3B43">Shavuot</text><text class="t" x="134" y="916" font-size="15" fill="#2E3633"></text><circle cx="102" cy="968" r="18" fill="#1F8A7D"/><text class="t n" x="102" y="974" font-size="17" text-anchor="middle" fill="#FFFFFF">9</text><text class="t" x="134" y="966" font-size="18" font-weight="700" fill="#0E3B43">Dia da Independência</text><text class="t" x="134" y="988" font-size="15" fill="#2E3633">também pelo calendário judaico</text><rect x="564" y="230" width="460" height="830" rx="18" fill="#B9773E" opacity=".14"/><text class="d" x="592" y="280" font-size="34" fill="#0E3B43">Brasil</text><text class="t" x="592" y="312" font-size="15" fill="#5F6A66">nas leis federais:</text><text class="t" x="592" y="332" font-size="15" fill="#5F6A66">sempre no mesmo dia</text><circle cx="610" cy="392" r="18" fill="#B9773E"/><text class="t n" x="610" y="398" font-size="17" text-anchor="middle" fill="#FFFFFF">1</text><text class="t" x="642" y="390" font-size="18" font-weight="700" fill="#0E3B43">1º de janeiro</text><text class="t" x="642" y="412" font-size="15" fill="#2E3633">Confraternização Universal</text><circle cx="610" cy="464" r="18" fill="#B9773E"/><text class="t n" x="610" y="470" font-size="17" text-anchor="middle" fill="#FFFFFF">2</text><text class="t" x="642" y="462" font-size="18" font-weight="700" fill="#0E3B43">21 de abril</text><text class="t" x="642" y="484" font-size="15" fill="#2E3633">Tiradentes</text><circle cx="610" cy="536" r="18" fill="#B9773E"/><text class="t n" x="610" y="542" font-size="17" text-anchor="middle" fill="#FFFFFF">3</text><text class="t" x="642" y="534" font-size="18" font-weight="700" fill="#0E3B43">1º de maio</text><text class="t" x="642" y="556" font-size="15" fill="#2E3633">Dia do Trabalho</text><circle cx="610" cy="608" r="18" fill="#B9773E"/><text class="t n" x="610" y="614" font-size="17" text-anchor="middle" fill="#FFFFFF">4</text><text class="t" x="642" y="606" font-size="18" font-weight="700" fill="#0E3B43">7 de setembro</text><text class="t" x="642" y="628" font-size="15" fill="#2E3633">Independência</text><circle cx="610" cy="680" r="18" fill="#B9773E"/><text class="t n" x="610" y="686" font-size="17" text-anchor="middle" fill="#FFFFFF">5</text><text class="t" x="642" y="678" font-size="18" font-weight="700" fill="#0E3B43">12 de outubro</text><text class="t" x="642" y="700" font-size="15" fill="#2E3633">Nossa Senhora Aparecida</text><circle cx="610" cy="752" r="18" fill="#B9773E"/><text class="t n" x="610" y="758" font-size="17" text-anchor="middle" fill="#FFFFFF">6</text><text class="t" x="642" y="750" font-size="18" font-weight="700" fill="#0E3B43">2 de novembro</text><text class="t" x="642" y="772" font-size="15" fill="#2E3633">Finados</text><circle cx="610" cy="824" r="18" fill="#B9773E"/><text class="t n" x="610" y="830" font-size="17" text-anchor="middle" fill="#FFFFFF">7</text><text class="t" x="642" y="822" font-size="18" font-weight="700" fill="#0E3B43">15 de novembro</text><text class="t" x="642" y="844" font-size="15" fill="#2E3633">Proclamação da República</text><circle cx="610" cy="896" r="18" fill="#B9773E"/><text class="t n" x="610" y="902" font-size="17" text-anchor="middle" fill="#FFFFFF">8</text><text class="t" x="642" y="894" font-size="18" font-weight="700" fill="#0E3B43">20 de novembro</text><text class="t" x="642" y="916" font-size="15" fill="#2E3633">Zumbi e Consciência Negra</text><circle cx="610" cy="968" r="18" fill="#B9773E"/><text class="t n" x="610" y="974" font-size="17" text-anchor="middle" fill="#FFFFFF">9</text><text class="t" x="642" y="966" font-size="18" font-weight="700" fill="#0E3B43">25 de dezembro</text><text class="t" x="642" y="988" font-size="15" fill="#2E3633">Natal</text><text class="t" x="56" y="1100" font-size="14.5" fill="#2E3633">Em Israel, Chanuká e Purim ficam fora; quem não é judeu descansa nas festas da sua comunidade. No Brasil, a portaria</text><text class="t" x="56" y="1122" font-size="14.5" fill="#2E3633">federal de 2026 também pôs a Paixão de Cristo (3 de abril) entre os feriados; o Carnaval é ponto facultativo.</text><line x1="56" x2="1024" y1="1166" y2="1166" stroke="#E4E0D6"/><text class="t" x="56" y="1192" font-size="12.5" fill="#5F6A66">Israel: Ordenação de Lei e Administração, art. 18A. Brasil: Leis 662/1949 (redação de 2002), 6.802/1980 e 14.759/2023;</text><text class="t" x="56" y="1212" font-size="12.5" fill="#5F6A66">portaria de 2026 pela imprensa. Sem feriados estaduais e municipais. Hebraico Fluente · Israel Além do Roteiro</text></g></svg>