<svg class="fig-molduras-diario" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Página com duas molduras: uma para colar uma foto da viagem e outra para desenhar um lugar."><style>
.fig-molduras-diario .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-molduras-diario .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-molduras-diario .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-molduras-diario .he{font-family:'Noto Serif Hebrew',serif}
.fig-molduras-diario .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="molduras-diario--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="molduras-diario--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="molduras-diario--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="molduras-diario--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1350" fill="#FBF9F5"/><g transform="rotate(-2 540 370)"><path d="M120 90 h840 v560 h-840Z" transform="translate(6 8)" fill="#D9CCB0"/><path d="M120 90 h840 v560 h-840Z" fill="#FFFFFF" stroke="#B8862F" stroke-width="6"/><rect x="150" y="120" width="780" height="450" fill="none" stroke="#D9CCB0" stroke-width="3" stroke-dasharray="10 10"/><text class="d" x="150" y="616" font-size="30" fill="#0E3B43">Cole aqui uma foto da viagem</text></g><g transform="rotate(2 540 990)"><path d="M120 720 h840 v540 h-840Z" transform="translate(6 8)" fill="#D9CCB0"/><path d="M120 720 h840 v540 h-840Z" fill="#FFFFFF" stroke="#1F8A7D" stroke-width="6"/><rect x="150" y="750" width="780" height="430" fill="none" stroke="#D9CCB0" stroke-width="3" stroke-dasharray="10 10"/><text class="d" x="150" y="1226" font-size="30" fill="#0E3B43">Desenhe aqui um lugar que você viu</text></g></g></svg>