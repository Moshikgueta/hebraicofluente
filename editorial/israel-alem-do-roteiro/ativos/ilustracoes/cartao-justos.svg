<svg class="fig-cartao-justos" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Cartão: dois brasileiros reconhecidos pelo Yad Vashem como Justos entre as Nações, Aracy de Carvalho Guimarães Rosa (1982) e Luiz Martins de Souza Dantas (2003)."><style>
.fig-cartao-justos .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-cartao-justos .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-cartao-justos .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-cartao-justos .he{font-family:'Noto Serif Hebrew',serif}
.fig-cartao-justos .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="cartao-justos--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="cartao-justos--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
