    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="cartao-justos--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1350" fill="#FBF9F5"/><rect width="1080" height="380" fill="#0E3B43"/><text class="t" x="64" y="92" font-size="17" font-weight="700" letter-spacing="3.5" fill="#8FD6C8">BRASIL E ISRAEL</text><text class="d" x="64" y="190" font-size="66" fill="#FFFFFF">Dois brasileiros</text><text class="d" x="64" y="266" font-size="66" fill="#FFFFFF">entre os Justos</text><rect x="70" y="478" width="940" height="300" rx="20" fill="#D9CCB0"/><rect x="64" y="470" width="940" height="300" rx="20" fill="#FFFFFF" stroke="#E4E0D6"/><text class="t n" x="104" y="562" font-size="72" fill="#8C5426">1982</text><text class="d" x="330" y="540" font-size="38" fill="#0E3B43">Aracy de Carvalho</text><text class="d" x="330" y="586" font-size="38" fill="#0E3B43">Guimarães Rosa</text><text class="t" x="330" y="642" font-size="22" fill="#2E3633">funcionária do consulado</text><text class="t" x="330" y="674" font-size="22" fill="#2E3633">brasileiro em Hamburgo</text><text class="t" x="104" y="600" font-size="18" fill="#5F6A66">ano da homenagem</text><rect x="70" y="828" width="940" height="300" rx="20" fill="#D9CCB0"/><rect x="64" y="820" width="940" height="300" rx="20" fill="#FFFFFF" stroke="#E4E0D6"/><text class="t n" x="104" y="912" font-size="72" fill="#8C5426">2003</text><text class="d" x="330" y="890" font-size="38" fill="#0E3B43">Luiz Martins de</text><text class="d" x="330" y="936" font-size="38" fill="#0E3B43">Souza Dantas</text><text class="t" x="330" y="992" font-size="22" fill="#2E3633">embaixador do Brasil na França;</text><text class="t" x="330" y="1024" font-size="22" fill="#2E3633">deu vistos a judeus depois de 1940</text><text class="t" x="104" y="950" font-size="18" fill="#5F6A66">ano da homenagem</text><line x1="64" x2="1016" y1="1254" y2="1254" stroke="#E4E0D6"/><text class="t" x="64" y="1290" font-size="15" fill="#5F6A66">Fonte: Yad Vashem (Justos entre as Nações)</text><text class="t" x="1016" y="1290" font-size="15" font-weight="600" text-anchor="end" fill="#0E3B43">Israel Além do Roteiro · Hebraico Fluente</text></g></svg>