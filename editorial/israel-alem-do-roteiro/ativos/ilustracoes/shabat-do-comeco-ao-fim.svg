<svg class="fig-shabat-do-comeco-ao-fim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1060" role="img" aria-label="Esquema do Shabat, do fim da tarde de sexta à noite de sábado: trens e a maior parte dos ônibus param; há ônibus em alguns lugares e ônibus gratuitos de fim de semana em Tel Aviv e vizinhas; táxi e sherut rodam com tarifa mais alta; em Tel Aviv, cerca de 160 mercearias podem abrir."><style>
.fig-shabat-do-comeco-ao-fim .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-shabat-do-comeco-ao-fim .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-shabat-do-comeco-ao-fim .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-shabat-do-comeco-ao-fim .he{font-family:'Noto Serif Hebrew',serif}
.fig-shabat-do-comeco-ao-fim .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="shabat-do-comeco-ao-fim--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="shabat-do-comeco-ao-fim--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="shabat-do-comeco-ao-fim--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="shabat-do-comeco-ao-fim--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1060" fill="#FBF9F5"/><text class="t" x="56" y="72" font-size="15" font-weight="700" letter-spacing="3" fill="#12665C">O SHABAT, DO COMEÇO AO FIM</text><text class="d" x="56" y="126" font-size="44" fill="#0E3B43">O que roda e o que para</text><rect x="250" y="200" width="154.8" height="60" fill="#F7EFDF"/><rect x="404.8" y="200" width="526.3199999999999" height="60" fill="#0E3B43"/><rect x="931.12" y="200" width="92.88" height="60" fill="#F7EFDF"/><text class="t" x="327.4" y="226" font-size="15" font-weight="700" text-anchor="middle" fill="#0E3B43">sexta</text><text class="t" x="327.4" y="246" font-size="14" text-anchor="middle" fill="#0E3B43">à tarde</text><text class="t" x="667.96" y="238" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="4" fill="#FFFFFF">SHABAT</text><text class="t" x="977.56" y="226" font-size="15" font-weight="700" text-anchor="middle" fill="#0E3B43">sábado</text><text class="t" x="977.56" y="246" font-size="14" text-anchor="middle" fill="#0E3B43">à noite</text><circle cx="404.8" cy="182" r="14" fill="#B8862F"/><text class="t" x="404.8" y="158" font-size="14" text-anchor="middle" fill="#8A6520">pôr do sol</text><text class="t" x="931.12" y="182" font-size="14" text-anchor="middle" fill="#8A6520">noite de sábado</text><text class="t" x="56" y="354" font-size="19" font-weight="700" fill="#0E3B43">Trens</text><rect x="250" y="330" width="774" height="40" rx="8" fill="#F3F0E9"/><rect x="250" y="330" width="114.80000000000001" height="40" fill="#1F8A7D"/><rect x="931.12" y="330" width="92.88" height="40" fill="#1F8A7D"/><text class="t" x="250" y="396" font-size="14.5" fill="#2E3633">param na sexta à tarde; voltam no sábado depois do pôr do sol</text><text class="t" x="56" y="466" font-size="19" font-weight="700" fill="#0E3B43">Ônibus</text><rect x="250" y="442" width="774" height="40" rx="8" fill="#F3F0E9"/><rect x="250" y="442" width="114.80000000000001" height="40" fill="#1F8A7D"/><rect x="364.8" y="442" width="566.3199999999999" height="40" fill="url(#shabat-do-comeco-ao-fim--parcial)"/><rect x="931.12" y="442" width="92.88" height="40" fill="#1F8A7D"/><text class="t" x="250" y="508" font-size="14.5" fill="#2E3633">na maior parte do país, não rodam; Haifa, parte da Galileia e localidades não judaicas têm</text><text class="t" x="56" y="578" font-size="19" font-weight="700" fill="#0E3B43">Ônibus de fim</text><text class="t" x="56" y="600" font-size="19" font-weight="700" fill="#0E3B43">de semana</text><rect x="250" y="554" width="774" height="40" rx="8" fill="#F3F0E9"/><rect x="404.8" y="554" width="526.3199999999999" height="40" fill="#1F8A7D"/><text class="t" x="250" y="620" font-size="14.5" fill="#2E3633">de semana gratuitos, criados em 2019 por Tel Aviv e três vizinhas</text><text class="t" x="56" y="690" font-size="19" font-weight="700" fill="#0E3B43">Táxi</text><rect x="250" y="666" width="774" height="40" rx="8" fill="#F3F0E9"/><rect x="250" y="666" width="154.8" height="40" fill="#1F8A7D"/><rect x="404.8" y="666" width="526.3199999999999" height="40" fill="#1F8A7D"/><rect x="931.12" y="666" width="92.88" height="40" fill="#1F8A7D"/><text class="t" x="250" y="732" font-size="14.5" fill="#2E3633">roda; a tarifa tem acréscimo de 25% no Shabat</text><text class="t" x="56" y="802" font-size="19" font-weight="700" fill="#0E3B43">Sherut</text><rect x="250" y="778" width="774" height="40" rx="8" fill="#F3F0E9"/><rect x="250" y="778" width="154.8" height="40" fill="#1F8A7D"/><rect x="404.8" y="778" width="526.3199999999999" height="40" fill="#1F8A7D"/><rect x="931.12" y="778" width="92.88" height="40" fill="#1F8A7D"/><text class="t" x="250" y="844" font-size="14.5" fill="#2E3633">as vans amarelas de Tel Aviv circulam, com tarifa mais alta</text><text class="t" x="56" y="914" font-size="19" font-weight="700" fill="#0E3B43">Mercearias</text><rect x="250" y="890" width="774" height="40" rx="8" fill="#F3F0E9"/><rect x="250" y="890" width="774" height="40" fill="#1F8A7D"/><text class="t" x="250" y="956" font-size="14.5" fill="#2E3633">em Tel Aviv, cerca de 160 podem abrir, por lei municipal</text><defs><pattern id="shabat-do-comeco-ao-fim--parcial" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#E4F1EE"/><line x1="0" x2="0" y1="0" y2="10" stroke="#1F8A7D" stroke-width="4"/></pattern></defs><rect x="56" y="1006" width="34" height="20" fill="#1F8A7D"/><text class="t" x="100" y="1022" font-size="14.5" fill="#2E3633">funciona</text><rect x="210" y="1006" width="34" height="20" fill="url(#shabat-do-comeco-ao-fim--parcial)"/><text class="t" x="254" y="1022" font-size="14.5" fill="#2E3633">só em alguns lugares</text><rect x="440" y="1006" width="34" height="20" fill="#F3F0E9" stroke="#E4E0D6"/><text class="t" x="484" y="1022" font-size="14.5" fill="#2E3633">não funciona</text><line x1="56" x2="1024" y1="986" y2="986" stroke="#E4E0D6"/><text class="t" x="56" y="1012" font-size="12.5" fill="#5F6A66">Fontes: Israel Railways e reportagens (trens e ônibus), prefeitura de Tel Aviv (táxi e sherut), lei do táxi, Suprema Corte (2017).</text><text class="t" x="56" y="1032" font-size="12.5" fill="#5F6A66">Esquema sem horário: o Shabat acompanha o pôr do sol e muda com a estação. Confira na semana da viagem.</text></g></svg>