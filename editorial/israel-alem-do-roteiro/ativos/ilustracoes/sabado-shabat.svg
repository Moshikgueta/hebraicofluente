<svg class="fig-sabado-shabat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" role="img" aria-label="Hebraico e português: o hebraico shabát, dia de descanso, passou ao grego sabbaton e ao latim sabbatum e chegou ao português como sábado."><style>
.fig-sabado-shabat .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-sabado-shabat .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-sabado-shabat .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-sabado-shabat .he{font-family:'Noto Serif Hebrew',serif}
.fig-sabado-shabat .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="sabado-shabat--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="sabado-shabat--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="sabado-shabat--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="sabado-shabat--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="860" fill="#FBF9F5"/><rect width="1080" height="140" fill="#0E3B43"/><text class="t" x="56" y="58" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">HEBRAICO E PORTUGUÊS</text><text class="d" x="56" y="112" font-size="42" fill="#FFFFFF">Uma palavra que o Brasil já fala</text><path d="M56 260 h210 v210 h-210z" transform="translate(7 9)" fill="#D9CCB0"/><path d="M56 260 h210 v210 h-210z" fill="#0E3B43"/><text class="he" x="161" y="360" font-size="56" style="font-size:56px" fill="#FFFFFF" direction="rtl" unicode-bidi="embed" text-anchor="middle">שַׁבָּת</text><text class="t" x="161" y="406" font-size="20" text-anchor="middle" font-style="italic" fill="#8FD6C8">shabát</text><text class="t" x="161" y="446" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3" fill="#8FD6C8">HEBRAICO</text><path d="M318 260 h210 v210 h-210z" transform="translate(7 9)" fill="#D9CCB0"/><path d="M318 260 h210 v210 h-210z" fill="#EFE7D6"/><text class="t" x="423" y="360" font-size="30" text-anchor="middle" font-style="italic" fill="#0E3B43">sabbaton</text><text class="t" x="423" y="446" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3" fill="#5F6A66">GREGO</text><path d="M580 260 h210 v210 h-210z" transform="translate(7 9)" fill="#D9CCB0"/><path d="M580 260 h210 v210 h-210z" fill="#EFE7D6"/><text class="t" x="685" y="360" font-size="30" text-anchor="middle" font-style="italic" fill="#0E3B43">sabbatum</text><text class="t" x="685" y="446" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3" fill="#5F6A66">LATIM</text><path d="M842 260 h210 v210 h-210z" transform="translate(7 9)" fill="#D9CCB0"/><path d="M842 260 h210 v210 h-210z" fill="#B8862F"/><text class="d" x="947" y="364" font-size="42" text-anchor="middle" fill="#FFFFFF">sábado</text><text class="t" x="947" y="446" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3" fill="#F7EFDF">PORTUGUÊS</text><path d="M272 365 H310" stroke="#B9773E" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#sabado-shabat--ponta)"/><path d="M534 365 H572" stroke="#B9773E" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#sabado-shabat--ponta)"/><path d="M796 365 H834" stroke="#B9773E" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#sabado-shabat--ponta)"/><text class="t" x="56" y="530" font-size="18" fill="#2E3633">Em hebraico, o dia de descanso;</text><text class="t" x="56" y="556" font-size="18" fill="#2E3633">a raiz fala em "descansar".</text><text class="t" x="580" y="530" font-size="18" fill="#2E3633">Em latim, o dia de descanso dos judeus;</text><text class="t" x="580" y="556" font-size="18" fill="#2E3633">depois, o nome do dia da semana.</text><rect x="56" y="610" width="968" height="120" rx="14" fill="#F7EFDF"/><text class="t" x="86" y="660" font-size="20" font-weight="600" fill="#0E3B43">Quem diz "sábado" em português está dizendo, de longe, a mesma palavra</text><text class="t" x="86" y="692" font-size="20" font-weight="600" fill="#0E3B43">que o israelense diz no cumprimento de sexta-feira: shabát shalóm.</text><text class="t" x="56" y="824" font-size="13" fill="#5F6A66">Fontes: Dicio, Dicionário Online de Português (sábado); Online Etymology Dictionary (Sabbath); Lewis &amp; Short,</text><text class="t" x="56" y="844" font-size="13" fill="#5F6A66">A Latin Dictionary (sabbatum). O caminho resume as obras de referência; não é um estudo próprio.</text></g></svg>