<svg class="fig-viagem-quatro-paradas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="A viagem em quatro paradas: a ETA-IL antes de comprar a passagem, três horas de antecedência no aeroporto, o ônibus pago com Rav-Kav e os trens parados no Shabat."><style>
.fig-viagem-quatro-paradas .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-viagem-quatro-paradas .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-viagem-quatro-paradas .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-viagem-quatro-paradas .he{font-family:'Noto Serif Hebrew',serif}
.fig-viagem-quatro-paradas .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="viagem-quatro-paradas--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="viagem-quatro-paradas--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="viagem-quatro-paradas--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="viagem-quatro-paradas--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1350" fill="#FBF9F5"/><text class="t" x="64" y="90" font-size="17" font-weight="700" letter-spacing="3.5" fill="#12665C">A VIAGEM EM QUATRO PARADAS</text><path d="M150 230 V1180" stroke="#D9CCB0" stroke-width="10" stroke-dasharray="2 18" stroke-linecap="round"/><circle cx="150" cy="270" r="44" fill="#1F8A7D" stroke="#FBF9F5" stroke-width="8"/><text class="t n" x="150" y="286" font-size="44" text-anchor="middle" fill="#FFFFFF">1</text><path d="M230 200 h780 v200 h-780Z" transform="translate(6 8)" fill="#D9CCB0"/><path d="M230 200 h780 v200 h-780Z" fill="#FFFFFF" stroke="#E4E0D6"/><text class="d" x="262" y="258" font-size="38" fill="#0E3B43">Antes de comprar</text><text class="t" x="262" y="304" font-size="24" fill="#2E3633">ETA-IL aprovada, obrigatória</text><text class="t" x="262" y="336" font-size="24" fill="#2E3633">desde 1º/1/2025; NIS 25;</text><text class="t" x="262" y="368" font-size="24" fill="#2E3633">peça 72 h antes da passagem</text><circle cx="150" cy="525" r="44" fill="#1E5A73" stroke="#FBF9F5" stroke-width="8"/><text class="t n" x="150" y="541" font-size="44" text-anchor="middle" fill="#FFFFFF">2</text><path d="M230 455 h780 v200 h-780Z" transform="translate(6 8)" fill="#D9CCB0"/><path d="M230 455 h780 v200 h-780Z" fill="#FFFFFF" stroke="#E4E0D6"/><text class="d" x="262" y="513" font-size="38" fill="#0E3B43">No aeroporto</text><text class="t" x="262" y="559" font-size="24" fill="#2E3633">Chegue 3 horas antes</text><text class="t" x="262" y="591" font-size="24" fill="#2E3633">do voo de volta, no</text><text class="t" x="262" y="623" font-size="24" fill="#2E3633">Ben Gurion</text><circle cx="150" cy="780" r="44" fill="#B9773E" stroke="#FBF9F5" stroke-width="8"/><text class="t n" x="150" y="796" font-size="44" text-anchor="middle" fill="#FFFFFF">3</text><path d="M230 710 h780 v200 h-780Z" transform="translate(6 8)" fill="#D9CCB0"/><path d="M230 710 h780 v200 h-780Z" fill="#FFFFFF" stroke="#E4E0D6"/><text class="d" x="262" y="768" font-size="38" fill="#0E3B43">No ônibus</text><text class="t" x="262" y="814" font-size="24" fill="#2E3633">Dinheiro não vale a bordo:</text><text class="t" x="262" y="846" font-size="24" fill="#2E3633">Rav-Kav anônimo (5 shekels)</text><text class="t" x="262" y="878" font-size="24" fill="#2E3633">ou aplicativo</text><circle cx="150" cy="1035" r="44" fill="#B8862F" stroke="#FBF9F5" stroke-width="8"/><text class="t n" x="150" y="1051" font-size="44" text-anchor="middle" fill="#FFFFFF">4</text><path d="M230 965 h780 v200 h-780Z" transform="translate(6 8)" fill="#D9CCB0"/><path d="M230 965 h780 v200 h-780Z" fill="#FFFFFF" stroke="#E4E0D6"/><text class="d" x="262" y="1023" font-size="38" fill="#0E3B43">No Shabat</text><text class="t" x="262" y="1069" font-size="24" fill="#2E3633">Os trens param na sexta</text><text class="t" x="262" y="1101" font-size="24" fill="#2E3633">à tarde e voltam no sábado</text><text class="t" x="262" y="1133" font-size="24" fill="#2E3633">depois do pôr do sol</text><text class="t" x="64" y="1310" font-size="15" fill="#5F6A66">Regras consultadas em 21/10/2026: confira de novo antes de viajar (capítulo 8).</text></g></svg>