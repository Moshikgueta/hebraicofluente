</defs><g fill="#1B211F"><rect width="1080" height="720" fill="#FBF9F5"/><rect width="1080" height="150" fill="#0E3B43"/><text class="t" x="56" y="62" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">JERUSALÉM X RIO DE JANEIRO</text><text class="d" x="56" y="118" font-size="44" fill="#FFFFFF">Uma volta na muralha</text><circle cx="296" cy="418" r="93.71794871794873" fill="none" stroke="#D9CCB0" stroke-width="22"/><circle cx="290" cy="410" r="93.71794871794873" fill="#F7EFDF" stroke="#8C5426" stroke-width="22" stroke-dasharray="14 6"/><circle cx="746" cy="418" r="170" fill="none" stroke="#D9CCB0" stroke-width="22"/><circle cx="740" cy="410" r="170" fill="#D3E6E8" stroke="#1E5A73" stroke-width="22"/><text class="t n" x="290" y="420" font-size="40" text-anchor="middle" fill="#8C5426">4,3 km</text><text class="t n" x="740" y="420" font-size="48" text-anchor="middle" fill="#1E5A73">7,8 km</text><text class="t" x="290" y="640" font-size="18" font-weight="700" text-anchor="middle" fill="#0E3B43">Muralha da Cidade Antiga</text><text class="t" x="290" y="664" font-size="14" text-anchor="middle" fill="#5F6A66">Autoridade de Antiguidades de Israel</text><text class="t" x="740" y="640" font-size="18" font-weight="700" text-anchor="middle" fill="#0E3B43">Contorno da Lagoa Rodrigo de Freitas</text><text class="t" x="740" y="664" font-size="14" text-anchor="middle" fill="#5F6A66">Fundação Rio-Águas, 2012</text><text class="t" x="56" y="702" font-size="13" fill="#5F6A66">Os anéis têm comprimento proporcional aos números; não são o desenho dos lugares. A muralha tem pouco mais da metade da volta da Lagoa.</text></g></svg>