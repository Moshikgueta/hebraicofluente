</defs><g fill="#1B211F"><rect width="1080" height="1282" fill="#FBF9F5"/><defs><linearGradient id="quem-governou-jerusalem--esmaece" x1="0" x2="1"><stop offset="0" stop-color="#FBF9F5" stop-opacity="1"/><stop offset="1" stop-color="#FBF9F5" stop-opacity="0"/></linearGradient></defs><rect width="1080" height="200" fill="#0E3B43"/><text class="t" x="56" y="66" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">LINHA DO TEMPO · CAPÍTULO 2</text><text class="d" x="56" y="134" font-size="54" fill="#FFFFFF">Quem governou Jerusalém</text><text class="t" x="56" y="176" font-size="18" fill="#E9DCC0">De 586 a.C. até hoje, em faixas. A escala muda em 1500, para caber o último século.</text><line x1="404.0" x2="404.0" y1="280" y2="1132" stroke="#E4E0D6" stroke-width="1.5"/><text class="t" x="404.0" y="270" font-size="13" text-anchor="middle" fill="#5F6A66">500 a.C.</text><line x1="510.7" x2="510.7" y1="280" y2="1132" stroke="#E4E0D6" stroke-width="1.5"/><text class="t" x="510.7" y="270" font-size="13" text-anchor="middle" fill="#5F6A66">1 d.C.</text><line x1="617.0" x2="617.0" y1="280" y2="1132" stroke="#E4E0D6" stroke-width="1.5"/><text class="t" x="617.0" y="270" font-size="13" text-anchor="middle" fill="#5F6A66">500</text><line x1="723.5" x2="723.5" y1="280" y2="1132" stroke="#E4E0D6" stroke-width="1.5"/><text class="t" x="723.5" y="270" font-size="13" text-anchor="middle" fill="#5F6A66">1000</text><line x1="830.0" x2="830.0" y1="280" y2="1132" stroke="#E4E0D6" stroke-width="1.5"/><text class="t" x="830.0" y="270" font-size="13" text-anchor="middle" fill="#5F6A66">1500</text><line x1="924.4" x2="924.4" y1="280" y2="1132" stroke="#E4E0D6" stroke-width="1.5"/><text class="t" x="924.4" y="270" font-size="13" text-anchor="middle" fill="#5F6A66">1700</text><line x1="992.9" x2="992.9" y1="280" y2="1132" stroke="#E4E0D6" stroke-width="1.5"/><text class="t" x="992.9" y="270" font-size="13" text-anchor="middle" fill="#5F6A66">1900</text><rect x="40" y="302" width="10