 v-24 a4 4 0 0 1 4 -4Z" fill="#1F8A7D"/><rect x="40" y="558" width="1000" height="60" rx="8" fill="#F3F0E9" opacity=".7"/><text class="t" x="56" y="586" font-size="17" font-weight="700" fill="#0E3B43">Hasmoneus</text><text class="t" x="56" y="607" font-size="14.5" fill="#5F6A66">164-63 a.C.</text><path d="M479.5 572 h13.5 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-13.5 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M479.5 572 h13.5 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-13.5 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#6B7444"/><text class="t" x="56" y="650" font-size="17" font-weight="700" fill="#0E3B43">Roma, depois Bizâncio</text><text class="t" x="56" y="671" font-size="14.5" fill="#5F6A66">63 a.C.-638 d.C.</text><path d="M501.0 636 h141.3 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-141.3 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M501.0 636 h141.3 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-141.3 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#B9773E"/><rect x="40" y="686" width="1000" height="60" rx="8" fill="#F3F0E9" opacity=".7"/><text class="t" x="56" y="714" font-size="17" font-weight="700" fill="#0E3B43">Califas muçulmanos</text><text class="t" x="56" y="735" font-size="14.5" fill="#5F6A66">638-1099</text><path d="M650.4 700 h90.2 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-90.2 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M650.4 700 h90.2 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-90.2 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#12665C"/><text class="t" x="56" y="778" font-size="17" font-weight="700" fill="#0E3B43">Cruzados</text><text class="t" x="56" y="799" font-size="14.5" fill="#5F6A66">1099-1187</text><path d="M748.6 764 h10.7 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-10.7 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M748.6 764 h10.7 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-10.7 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#8A6520"/><rect x="40" y="814" width="1000" height="60" rx="8" fill="#F3F0E9" opacity=".7"/><text class="t" x="56" y="842" font-size="17" font-weight="700" fill="#0E3B43">Saladino e os sultanatos seguintes</text><text class="t" x="56" y="863" font-size="14.5" fill="#5F6A66">1187-1516/17</text><path d="M767.3 828 h90.5 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-90.5 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M767.3 828 h90.5 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-90.5 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#1F8A7D"/><text class="t" x="56" y="906" font-size="17" font-weight="700" fill="#0E3B43">Otomanos</text><text class="t" x="56" y="927" font-size="14.5" fill="#5F6A66">1516/17-1917</text><path d="M865.8 892 h128.9 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-128.9 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M865.8 892 h128.9 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-128.9 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#1E5A73"/><rect x="40" y="942" width="1000" height="60" rx="8" fill="#F3F0E9" opacity=".7"/><text class="t" x="56" y="970" font-size="17" font-weight="700" fill="#0E3B43">Britânicos</text><text class="t" x="56" y="991" font-size="14.5" fill="#5F6A66">1917-1948</text><path d="M1002.7 956 h2.6 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-2.6 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M1002.7 956 h2.6 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-2.6 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#8C5426"/><text class="t" x="56" y="1034" font-size="17" font-weight="700" fill="#0E3B43">Cidade dividida: Jordânia e Israel</text><text class="t" x="56" y="1055" font-size="14.5" fill="#5F6A66">1949-1967</text><path d="M1013.7 1020 h1.0 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-1.0 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M1013.7 1020 h1.0 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-1.0 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#B8862F"/><rect x="40" y="1070" width="1000" height="60" rx="8" fill="#F3F0E9" opacity=".7"/><text class="t" x="56" y="1098" font-size="17" font-weight="700" fill="#0E3B43">Israel</text><text class="t" x="56" y="1119" font-size="14.5" fill="#5F6A66">desde 1967</text><path d="M1019.8 1084 h12.2 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-12.2 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" transform="translate(3 4)" fill="#D9CCB0"/><path d="M1019.8 1084 h12.2 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-12.2 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4Z" fill="#0E3B43"/><rect x="833" y="284" width="20" height="852" fill="#FBF9F5"/><path d="M833 284 V1136 M853 284 V1136" stroke="#5F6A66" stroke-width="1.5" stroke-dasharray="3 5"/><text class="t" x="843" y="1156" font-size="12.5" text-anchor="middle" fill="#5F6A66">a escala muda</text><line x1="56" x2="1024" y1="1176" y2="1176" stroke="#E4E0D6"/><text class="t" x="56" y="1202" font-size="13" fill="#5F6A66">Faixas simplificadas: só as passagens de poder registradas neste capítulo (a cidade dividida, no capítulo 3). Datas antigas</text><text class="t" x="56" y="1222" font-size="13" fill="#5F6A66">aproximadas; "c." quer dizer "cerca de". O começo dos reis de Judá é debatido e fica esmaecido. Hebraico Fluente · Israel Além do Roteiro</text></g></svg>