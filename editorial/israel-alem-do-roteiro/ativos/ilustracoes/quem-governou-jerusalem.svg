<svg class="fig-quem-governou-jerusalem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1282" role="img" aria-label="Faixas de quem governou Jerusalém: reis de Judá até 586 a.C., Babilônia, persas, reinos gregos, hasmoneus, Roma e depois Bizâncio até 638, califas muçulmanos, cruzados de 1099 a 1187, Saladino e os sultanatos seguintes, otomanos de 1516/17 a 1917, britânicos até 1948, a cidade dividida de 1949 a 1967 e Israel desde 1967."><style>
