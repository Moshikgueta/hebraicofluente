ill="#F7EFDF"/><text class="t" x="792" y="798" font-size="20" font-weight="700" fill="#8C5426">O Brasil</text><text class="t" x="792" y="828" font-size="20" font-weight="700" fill="#8C5426">votou a favor.</text><text class="t" x="56" y="904" font-size="15" fill="#5F6A66">Na Assembleia havia 57 membros: um deles não votou. Cada ponto é um voto; o círculo dourado é o do Brasil.</text><line x1="56" x2="1024" y1="1006" y2="1006" stroke="#E4E0D6"/><text class="t" x="56" y="1034" font-size="12.5" fill="#5F6A66">Fontes: ONU (biografia oficial dos presidentes da Assembleia Geral; registro de votação na Biblioteca Digital da ONU, 128ª sessão plenária).</text><text class="t" x="56" y="1054" font-size="12.5" fill="#5F6A66">O martelo é desenho. Hebraico Fluente · Israel Além do Roteiro</text></g></svg>