<svg class="fig-aranha-1947" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="Oswaldo Aranha, brasileiro, presidiu a segunda sessão da Assembleia Geral da ONU, que aprovou a Resolução 181 em 29 de novembro de 1947 por 33 votos a 13, com 10 abstenções; o Brasil votou a favor."><style>
