</defs><g fill="#1B211F"><rect width="1080" height="1080" fill="#FBF9F5"/><rect width="1080" height="330" fill="#0E3B43"/><text class="t" x="56" y="72" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">BRASIL NA ONU · 1947</text><text class="d" x="56" y="150" font-size="64" fill="#FFFFFF">Um brasileiro</text><text class="d" x="56" y="222" font-size="64" fill="#B8862F">na presidência</text><text class="t" x="56" y="272" font-size="19" fill="#E9DCC0">Oswaldo Aranha, nascido em Alegrete (RS) em 1894, presidiu a segunda sessão</text><text class="t" x="56" y="300" font-size="19" fill="#E9DCC0">da Assembleia Geral da ONU: a que votou a partilha da Palestina.</text><g transform="translate(900 170) rotate(-30)"><rect x="-70" y="-26" width="140" height="52" rx="10" fill="#B8862F"/><rect x="-80" y="-30" width="18" height="60" rx="5" fill="#8A6520"/><rect x="62" y="-30" width="18" height="60" rx="5" fill="#8A6520"/><rect x="-8" y="26" width="16" height="130" rx="6" fill="#8A6520"/></g><text class="t" x="56" y="400" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0E3B43">29 DE NOVEMBRO DE 1947 · RESOLUÇÃO 181</text><circle cx="89" cy="464" r="24" fill="#D9CCB0" opacity=".7"/><circle cx="86" cy="460" r="24" fill="#1F8A7D"/><circle cx="155" cy="464" r="24" fill="#D9CCB0" opacity=".7"/><circle cx="152" cy="460" r="24" fill="#1F8A7D"/><circle cx="221" cy="464" r="24" fill="#D9CCB0" opacity=".7"/><circle cx="218" cy="460" r="24" fill="#1F8A7D"/><circle cx="287" cy="464" r="24" fill="#D9CCB0" opacity=".7"/><circle cx="284" cy="460" r="24" fill="#1F8A7D" stroke="#B8862F" stroke-width="7"/><text class="t" x="284" y="466" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">BR</text><circle cx="353" cy="464" r="24" fill="#D9CCB0" opacity=".7"/><circle cx="350" cy="460" r="24" fill="#1F8A7D"/><circle cx="419" cy="464" r="24" fill="#D9CCB0" opacity=".7"/><circle cx="416" cy="460" r="24" fill="#1F8A7D"/><circle cx="485" cy="464" r="24" fill="#D