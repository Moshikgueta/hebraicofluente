<svg class="fig-conta-israel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="A conta em Israel: gorjeta de 10% a 15%, por costume, não por lei."><style>
.fig-conta-israel .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-conta-israel .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-conta-israel .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-conta-israel .he{font-family:'Noto Serif Hebrew',serif}
.fig-conta-israel .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="conta-israel--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="conta-israel--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="conta-israel--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="conta-israel--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1080" fill="#F7EFDF"/><path d="M300 110 H780 V880 L765 900 L750 880 L735 900 L720 880 L705 900 L690 880 L675 900 L660 880 L645 900 L630 880 L615 900 L600 880 L585 900 L570 880 L555 900 L540 880 L525 900 L510 880 L495 900 L480 880 L465 900 L450 880 L435 900 L420 880 L405 900 L390 880 L375 900 L360 880 L345 900 L330 880 L315 900 L300 880Z" transform="translate(9 11)" fill="#D9CCB0"/><path d="M300 110 H780 V880 L765 900 L750 880 L735 900 L720 880 L705 900 L690 880 L675 900 L660 880 L645 900 L630 880 L615 900 L600 880 L585 900 L570 880 L555 900 L540 880 L525 900 L510 880 L495 900 L480 880 L465 900 L450 880 L435 900 L420 880 L405 900 L390 880 L375 900 L360 880 L345 900 L330 880 L315 900 L300 880Z" fill="#FFFFFF" stroke="#D9CCB0" stroke-width="2"/><text class="t" x="540" y="180" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="5" fill="#8A6520">ISRAEL</text><text class="he" x="540" y="230" font-size="40" fill="#0E3B43" direction="rtl" unicode-bidi="embed" text-anchor="middle">חֶשְׁבּוֹן</text><text class="t" x="540" y="262" font-size="16" text-anchor="middle" font-style="italic" fill="#5F6A66">cheshbón, a conta</text><rect x="340" y="310" width="200" height="14" rx="7" fill="#E4E0D6"/><rect x="660" y="310" width="80" height="14" rx="7" fill="#E4E0D6"/><rect x="340" y="362" width="150" height="14" rx="7" fill="#E4E0D6"/><rect x="660" y="362" width="80" height="14" rx="7" fill="#E4E0D6"/><rect x="340" y="414" width="230" height="14" rx="7" fill="#E4E0D6"/><rect x="660" y="414" width="80" height="14" rx="7" fill="#E4E0D6"/><rect x="340" y="466" width="120" height="14" rx="7" fill="#E4E0D6"/><rect x="660" y="466" width="80" height="14" rx="7" fill="#E4E0D6"/><line x1="330" x2="750" y1="530" y2="530" stroke="#0E3B43" stroke-width="2" stroke-dasharray="4 6"/><text class="t" x="340" y="580" font-size="22" font-weight="700" fill="#0E3B43">Gorjeta</text><text class="t n" x="540" y="680" font-size="84" text-anchor="middle" fill="#8C5426">10% a 15%</text><text class="t" x="540" y="730" font-size="20" text-anchor="middle" fill="#2E3633">da conta, por costume</text><rect x="360" y="770" width="360" height="56" rx="28" fill="#0E3B43"/><text class="t" x="540" y="806" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">costume, não lei</text><text class="t" x="540" y="958" font-size="17" text-anchor="middle" fill="#2E3633">Jerusalem Post e Israel21c: de 10% a 15% nos restaurantes;</text><text class="t" x="540" y="984" font-size="17" text-anchor="middle" fill="#2E3633">o antigo 10% subiu para cerca de 12%, e 15% em Tel Aviv.</text><text class="t" x="540" y="1010" font-size="17" text-anchor="middle" fill="#5F6A66">Antes de calcular, veja se a conta já inclui o serviço.</text><text class="t" x="540" y="1064" font-size="13" text-anchor="middle" fill="#5F6A66">As linhas dos pratos ficam sem valor de propósito. Consulta em 21/10/2026.</text></g></svg>