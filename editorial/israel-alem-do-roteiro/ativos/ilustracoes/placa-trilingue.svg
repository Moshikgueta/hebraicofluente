<svg class="fig-placa-trilingue" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1110" role="img" aria-label="Anatomia de uma placa trilíngue desenhada: em cima o nome de Acre em hebraico sem vogais, no meio a faixa do árabe deixada sem texto, embaixo a transliteração Akko; e, abaixo, os três nomes da cidade ao longo do tempo segundo a UNESCO."><style>
.fig-placa-trilingue .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-placa-trilingue .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-placa-trilingue .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-placa-trilingue .he{font-family:'Noto Serif Hebrew',serif}
.fig-placa-trilingue .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="placa-trilingue--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="placa-trilingue--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="placa-trilingue--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="placa-trilingue--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1110" fill="#FBF9F5"/><rect width="1080" height="140" fill="#0E3B43"/><text class="t" x="56" y="58" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">ANATOMIA DE UMA PLACA</text><text class="d" x="56" y="112" font-size="42" fill="#FFFFFF">Três escritas, um nome</text><rect x="530" y="660" width="26" height="90" fill="#D9CCB0"/><rect x="524" y="652" width="26" height="100" fill="#5F6A66"/><path d="M240 200 H840 Q860 200 860 220 V640 Q860 660 840 660 H240 Q220 660 220 640 V220 Q220 200 240 200Z" transform="translate(9 11)" fill="#D9CCB0"/><path d="M240 200 H840 Q860 200 860 220 V640 Q860 660 840 660 H240 Q220 660 220 640 V220 Q220 200 240 200Z" fill="#0E3B43"/><path d="M240 214 H840 Q846 214 846 220 V640 Q846 646 840 646 H240 Q234 646 234 640 V220 Q234 214 240 214Z" fill="none" stroke="#FFFFFF" stroke-width="4"/><text class="he" x="540" y="330" font-size="104" style="font-size:104px" fill="#FFFFFF" direction="rtl" unicode-bidi="embed" text-anchor="middle">עכו</text><rect x="300" y="380" width="480" height="96" rx="12" fill="none" stroke="#8FD6C8" stroke-width="3" stroke-dasharray="10 8"/><text class="t" x="540" y="424" font-size="22" font-weight="700" text-anchor="middle" fill="#8FD6C8">faixa do árabe</text><text class="t" x="540" y="452" font-size="17" text-anchor="middle" fill="#8FD6C8">(sem texto neste desenho)</text><text class="t" x="540" y="590" font-size="86" font-weight="700" text-anchor="middle" fill="#FFFFFF">Akko</text><text class="t" x="56" y="250" font-size="20" font-weight="700" fill="#0E3B43">Hebraico</text><text class="t" x="56" y="276" font-size="15" fill="#5F6A66">sem os sinais</text><text class="t" x="56" y="296" font-size="15" fill="#5F6A66">de vogal</text><text class="t" x="56" y="420" font-size="20" font-weight="700" fill="#0E3B43">Árabe</text><path d="M200 330 H70" stroke="#B9773E" stroke-width="4" marker-end="url(#placa-trilingue--ponta)"/><path d="M200 450 H70" stroke="#B9773E" stroke-width="4" marker-end="url(#placa-trilingue--ponta)"/><text class="t" x="56" y="360" font-size="15" font-style="italic" fill="#8C5426">da direita para</text><text class="t" x="56" y="380" font-size="15" font-style="italic" fill="#8C5426">a esquerda</text><text class="t" x="56" y="480" font-size="15" font-style="italic" fill="#8C5426">da direita para</text><text class="t" x="56" y="500" font-size="15" font-style="italic" fill="#8C5426">a esquerda</text><text class="t" x="56" y="560" font-size="20" font-weight="700" fill="#0E3B43">Letras latinas</text><text class="t" x="56" y="586" font-size="15" fill="#5F6A66">transliteração:</text><text class="t" x="56" y="606" font-size="15" fill="#5F6A66">o som do nome</text><circle cx="472" cy="296" r="40" fill="none" stroke="#B8862F" stroke-width="4"/><path d="M432 280 C 380 250 920 250 880 290" fill="none" stroke="none"/><path d="M512 276 C 600 250 760 250 880 262" fill="none" stroke="#B8862F" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/><text class="t" x="886" y="254" font-size="16" font-weight="700" fill="#8A6520">o <tspan class="he" font-size="20" style="font-size:20px">ו</tspan> faz o</text><text class="t" x="886" y="276" font-size="16" font-weight="700" fill="#8A6520">papel do o:</text><text class="t" x="886" y="298" font-size="16" font-style="italic" fill="#8A6520">Áko</text><rect x="56" y="760" width="968" height="270" rx="16" fill="#F7EFDF"/><text class="t" x="86" y="804" font-size="15" font-weight="700" letter-spacing="2" fill="#8C5426">UM NOME, TRÊS ÉPOCAS, SEGUNDO O DOSSIÊ DA UNESCO</text><line x1="200" x2="880" y1="872" y2="872" stroke="#0E3B43" stroke-width="3"/><circle cx="200" cy="872" r="12" fill="#0E3B43"/><text class="t" x="200" y="916" font-size="26" font-weight="700" text-anchor="middle" fill="#0E3B43">Akko</text><text class="t" x="200" y="944" font-size="16" text-anchor="middle" fill="#2E3633">no Antigo</text><text class="t" x="200" y="966" font-size="16" text-anchor="middle" fill="#2E3633">Testamento</text><circle cx="540" cy="872" r="12" fill="#0E3B43"/><text class="t" x="540" y="916" font-size="26" font-weight="700" text-anchor="middle" fill="#0E3B43">Ptolemais</text><text class="t" x="540" y="944" font-size="16" text-anchor="middle" fill="#2E3633">no período</text><text class="t" x="540" y="966" font-size="16" text-anchor="middle" fill="#2E3633">helenístico</text><circle cx="880" cy="872" r="12" fill="#0E3B43"/><text class="t" x="880" y="916" font-size="26" font-weight="700" text-anchor="middle" fill="#0E3B43">Akko</text><text class="t" x="880" y="944" font-size="16" text-anchor="middle" fill="#2E3633">de volta, no</text><text class="t" x="880" y="966" font-size="16" text-anchor="middle" fill="#2E3633">período árabe</text><text class="t" x="540" y="1008" font-size="16" text-anchor="middle" font-style="italic" fill="#8C5426">Entre 1191 e 1291, capital do segundo reino cruzado. Em português, Acre.</text><text class="t" x="56" y="1070" font-size="13" fill="#5F6A66">Placa desenhada, não é retrato de uma placa real: a ordem das faixas é ilustrativa, e a faixa do árabe vai sem texto</text><text class="t" x="56" y="1090" font-size="13" fill="#5F6A66">porque este livro não registrou a grafia árabe do nome. Fonte dos nomes: dossiê de candidatura da UNESCO.</text></g></svg>