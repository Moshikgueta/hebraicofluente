<svg class="fig-quem-mora-israel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" role="img" aria-label="Gráfico: 10,244 milhões de habitantes em Israel em abril de 2026, divididos em 76% de judeus e outros, 21,1% de árabes e 2,9% de estrangeiros."><style>
.fig-quem-mora-israel .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-quem-mora-israel .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-quem-mora-israel .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-quem-mora-israel .he{font-family:'Noto Serif Hebrew',serif}
.fig-quem-mora-israel .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="quem-mora-israel--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="quem-mora-israel--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
