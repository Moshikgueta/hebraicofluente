  </pattern>
  <pattern id="quem-mora-israel--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="quem-mora-israel--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="820" fill="#FBF9F5"/><text class="t" x="56" y="72" font-size="15" font-weight="700" letter-spacing="3" fill="#12665C">QUEM MORA EM ISRAEL · ABRIL DE 2026</text><text class="t n" x="56" y="156" font-size="76" fill="#0E3B43">10,244 milhões</text><text class="t" x="56" y="194" font-size="17" fill="#5F6A66">de habitantes, na estimativa do CBS para a véspera do Dia da Independência</text><rect x="62" y="268" width="968" height="110" rx="14" fill="#D9CCB0"/><clipPath id="quem-mora-israel--barra"><rect x="56" y="260" width="968" height="110" rx="14"/></clipPath><g clip-path="url(#quem-mora-israel--barra)"><rect x="56.0" y="260" width="735.7" height="110" fill="#0E3B43"/><rect x="791.7" y="260" width="204.2" height="110" fill="#1F8A7D"/><rect x="995.9" y="260" width="28.1" height="110" fill="#B8862F"/></g><text class="t n" x="84" y="330" font-size="44" fill="#FFFFFF">76%</text><text class="t n" x="813.6800000000001" y="330" font-size="38" fill="#FFFFFF">21,1%</text><path d="M1009.48 370 V388" fill="none" stroke="#8A6520" stroke-width="2"/><text class="t n" x="1024" y="420" font-size="30" text-anchor="end" fill="#8A6520">2,9%</text><rect x="56" y="450" width="300" height="250" rx="14" fill="#0E3B43" opacity=".12"/><text class="t" x="76" y="492" font-size="20" font-weight="700" fill="#0E3B43">Judeus e outros</text><text class="t" x="76" y="520" font-size="16" fill="#5F6A66">7,790 milhões</text><text class="t" x="76" y="562" font-size="16" fill="#2E3633">"Outros": cristãos não</text><text class="t" x="76" y="586" font-size="16" fill="#2E3633">árabes, outras religiões</text><text class="t" x="76" y="610" font-size="16" fill="#2E3633">e quem está registrado</text><text class="t" x="76" y="634" font-size="16" fill="#2E3633">sem religião.</text><rect x="390" y="450" width="300" height="250" rx="14" fill="#1F8A7D" opacity=".12"/><text class="t" x="410" y="492" font-size="20" font-weight="700" fill="#0E3B43">Árabes</text><text class="t" x="410" y="520" font-size="16" fill="#5F6A66">2,157 milhões</text><text class="t" x="410" y="562" font-size="16" fill="#2E3633">Muçulmanos, cristãos</text><text class="t" x="410" y="586" font-size="16" fill="#2E3633">árabes e drusos: três</text><text class="t" x="410" y="610" font-size="16" fill="#2E3633">comunidades com o</text><text class="t" x="410" y="634" font-size="16" fill="#2E3633">mesmo rótulo.</text><rect x="724" y="450" width="300" height="250" rx="14" fill="#B8862F" opacity=".12"/><text class="t" x="744" y="492" font-size="20" font-weight="700" fill="#0E3B43">Estrangeiros</text><text class="t" x="744" y="520" font-size="16" fill="#5F6A66">296 mil</text><text class="t" x="744" y="562" font-size="16" fill="#2E3633">Entram no total do</text><text class="t" x="744" y="586" font-size="16" fill="#2E3633">país, mas fora dos</text><text class="t" x="744" y="610" font-size="16" fill="#2E3633">dois grandes grupos.</text><line x1="56" x2="1024" y1="746" y2="746" stroke="#E4E0D6"/><text class="t" x="56" y="772" font-size="12.5" fill="#5F6A66">Fonte: Escritório Central de Estatística de Israel (CBS), comunicado 117/2026, dado preliminar. Os três números são do mesmo dia.</text><text class="t" x="56" y="792" font-size="12.5" fill="#5F6A66">Barra proporcional às porcentagens. Hebraico Fluente · Israel Além do Roteiro</text></g></svg>