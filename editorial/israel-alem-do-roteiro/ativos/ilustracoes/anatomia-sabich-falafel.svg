66" font-size="16" text-anchor="middle" fill="#0B2A31">1</text><path d="M646 560 L680 560" stroke="#0E3B43" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/><circle cx="990" cy="422" r="15" fill="#D9CCB0"/><circle cx="990" cy="420" r="15" fill="#B8862F" stroke="#FBF9F5" stroke-width="2.5"/><text class="t n" x="990" y="426" font-size="16" text-anchor="middle" fill="#0B2A31">2</text><path d="M974 420 L860 402" stroke="#0E3B43" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/><circle cx="980" cy="262" r="15" fill="#D9CCB0"/><circle cx="980" cy="260" r="15" fill="#B8862F" stroke="#FBF9F5" stroke-width="2.5"/><text class="t n" x="980" y="266" font-size="16" text-anchor="middle" fill="#0B2A31">3</text><path d="M964 264 L900 296" stroke="#0E3B43" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/><circle cx="590" cy="756" r="15" fill="#D9CCB0"/><circle cx="590" cy="754" r="15" fill="#B8862F" stroke="#FBF9F5" stroke-width="2.5"/><text class="t n" x="590" y="760" font-size="16" text-anchor="middle" fill="#0B2A31">1</text><text class="t" x="616" y="760" font-size="19" font-weight="700" fill="#0E3B43">Pita</text><circle cx="590" cy="816" r="15" fill="#D9CCB0"/><circle cx="590" cy="814" r="15" fill="#B8862F" stroke="#FBF9F5" stroke-width="2.5"/><text class="t n" x="590" y="820" font-size="16" text-anchor="middle" fill="#0B2A31">2</text><text class="t" x="616" y="820" font-size="19" font-weight="700" fill="#0E3B43">Falafel</text><text class="t" x="616" y="844" font-size="15" fill="#5F6A66">bolinhos fritos</text><circle cx="590" cy="876" r="15" fill="#D9CCB0"/><circle cx="590" cy="874" r="15" fill="#B8862F" stroke="#FBF9F5" stroke-width="2.5"/><text class="t n" x="590" y="880" font-size="16" text-anchor="middle" fill="#0B2A31">3</text><text class="t" x="616" y="880" font-size="19" font-weight="700" fill="#0E3B43">Salada</text><text class="t" x="590" y="930" font-size="15" font-style="italic" fill="#5F6A66">O trio é uma combinação do século XX,</text><text class="t" x="590" y="952" font-size="15" font-style="italic" fill="#5F6A66">segundo o historiador Shaul Stampfer.</text><rect x="56" y="975" width="968" height="48" rx="10" fill="#F7EFDF"/><text class="t" x="76" y="1006" font-size="15" fill="#8C5426">Na hipótese que põe a origem no Egito, o bolinho original era de fava, a taamíya; a origem segue em aberto.</text><text class="t" x="56" y="1048" font-size="12.5" fill="#5F6A66">Desenho esquemático, não é receita. Fontes: Ynetnews e The Jewish Independent (sabich); History Today e S. Stampfer (falafel).</text></g></svg>