ht="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/><rect x="345" y="728" width="84" height="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/><rect x="435" y="728" width="84" height="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/><rect x="525" y="728" width="84" height="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/><rect x="615" y="728" width="84" height="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/><rect x="705" y="728" width="84" height="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/><rect x="795" y="728" width="84" height="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/><rect x="885" y="728" width="84" height="30" rx="2" fill="none" stroke="#D9CCB0" stroke-width="2"/></g><rect x="420" y="380" width="140" height="90" fill="#12665C"/><path d="M410 382 C410 270 570 270 570 382Z" fill="#B8862F" stroke="#8A6520" stroke-width="3"/><rect x="680" y="410" width="160" height="60" fill="#D9CCB0"/><path d="M730 412 C730 364 790 364 790 412Z" fill="#8E9894"/><text class="t" x="490" y="254" font-size="17" font-weight="700" text-anchor="middle" fill="#0E3B43">Domo da Rocha</text><text class="t" x="760" y="350" font-size="17" font-weight="700" text-anchor="middle" fill="#0E3B43">Mesquita de al-Aqsa</text><path d="M150 760 L190 470" stroke="#B8862F" stroke-width="12" stroke-linecap="round"/><path d="M168 590 L116 430" stroke="#0E3B43" stroke-width="1.5"/><text class="t" x="56" y="350" font-size="19" font-weight="700" fill="#0E3B43">Muro Ocidental</text><text class="t" x="56" y="374" font-size="15" fill="#2E3633">a face oeste, a mais comprida:</text><text class="t n" x="56" y="410" font-size="30" fill="#8C5426">485 m</text><text class="t" x="540" y="730" font-size="16" text-anchor="middle" fill="#8C5426">Muros de contenção de Herodes, sobre a rocha; cada pedra, cerca de 5 toneladas</text><line x1="56" x2="1024" y1="806" y2="806" stroke="#0E3B43" stroke-width="1.5"/><text class="t" x="56" y="850" font-size="15" font-weight="700" fill="#0E3B43">O status quo, nas palavras do governo de Israel (2015):</text><text class="t" x="56" y="882" font-size="17" font-style="italic" fill="#2E3633">"os muçulmanos rezam no Monte do Templo; os não muçulmanos visitam o Monte do Templo".</text><text class="t" x="56" y="912" font-size="14.5" fill="#5F6A66">A administração é do Waqf jordaniano; a segurança, de Israel; o visitante não muçulmano entra em horários limitados.</text><text class="t" x="56" y="942" font-size="12.5" fill="#5F6A66">Corte esquemático, fora de escala. Fontes: Autoridade de Antiguidades de Israel; Gabinete do Primeiro-Ministro de Israel (2015).</text></g></svg>