<svg class="fig-cartao-eurovisao" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Cartão: as quatro vitórias de Israel no Festival Eurovisão, em 1978, 1979, 1998 e 2018."><style>
.fig-cartao-eurovisao .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-cartao-eurovisao .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-cartao-eurovisao .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-cartao-eurovisao .he{font-family:'Noto Serif Hebrew',serif}
.fig-cartao-eurovisao .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="cartao-eurovisao--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="cartao-eurovisao--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
