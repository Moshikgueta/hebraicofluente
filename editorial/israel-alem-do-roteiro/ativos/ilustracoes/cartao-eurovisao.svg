  </pattern>
  <pattern id="cartao-eurovisao--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="cartao-eurovisao--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1350" fill="#FBF9F5"/><rect width="1080" height="380" fill="#0E3B43"/><text class="t" x="64" y="92" font-size="17" font-weight="700" letter-spacing="3.5" fill="#8FD6C8">CULTURA</text><text class="d" x="64" y="190" font-size="66" fill="#FFFFFF">Quatro vitórias</text><text class="d" x="64" y="266" font-size="66" fill="#FFFFFF">no Eurovisão</text><circle cx="140" cy="520" r="62" fill="#B8862F"/><text class="t n" x="140" y="534" font-size="50" text-anchor="middle" fill="#FFFFFF">78</text><text class="t n" x="240" y="506" font-size="30" fill="#8C5426">1978</text><text class="d" x="240" y="550" font-size="42" fill="#0E3B43">"A-Ba-Ni-Bi"</text><text class="t" x="240" y="586" font-size="22" fill="#2E3633">Izhar Cohen e Alphabeta</text><circle cx="140" cy="710" r="62" fill="#1F8A7D"/><text class="t n" x="140" y="724" font-size="50" text-anchor="middle" fill="#FFFFFF">79</text><text class="t n" x="240" y="696" font-size="30" fill="#8C5426">1979</text><text class="d" x="240" y="740" font-size="42" fill="#0E3B43">"Hallelujah"</text><text class="t" x="240" y="776" font-size="22" fill="#2E3633">Milk and Honey e Gali Atari</text><circle cx="140" cy="900" r="62" fill="#B9773E"/><text class="t n" x="140" y="914" font-size="50" text-anchor="middle" fill="#FFFFFF">98</text><text class="t n" x="240" y="886" font-size="30" fill="#8C5426">1998</text><text class="d" x="240" y="930" font-size="42" fill="#0E3B43">"Diva"</text><text class="t" x="240" y="966" font-size="22" fill="#2E3633">Dana International</text><circle cx="140" cy="1090" r="62" fill="#1E5A73"/><text class="t n" x="140" y="1104" font-size="50" text-anchor="middle" fill="#FFFFFF">18</text><text class="t n" x="240" y="1076" font-size="30" fill="#8C5426">2018</text><text class="d" x="240" y="1120" font-size="42" fill="#0E3B43">"Toy"</text><text class="t" x="240" y="1156" font-size="22" fill="#2E3633">Netta Barzilai</text><line x1="64" x2="1016" y1="1254" y2="1254" stroke="#E4E0D6"/><text class="t" x="64" y="1290" font-size="15" fill="#5F6A66">Fonte: European Broadcasting Union</text><text class="t" x="1016" y="1290" font-size="15" font-weight="600" text-anchor="end" fill="#0E3B43">Israel Além do Roteiro · Hebraico Fluente</text></g></svg>