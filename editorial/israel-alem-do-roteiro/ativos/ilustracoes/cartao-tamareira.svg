<svg class="fig-cartao-tamareira" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Cartão: uma semente de tâmara de cerca de 2.000 anos, achada em Massada nos anos 1960, germinou em 2005; a muda se chama Matusalém."><style>
.fig-cartao-tamareira .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-cartao-tamareira .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-cartao-tamareira .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-cartao-tamareira .he{font-family:'Noto Serif Hebrew',serif}
.fig-cartao-tamareira .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="cartao-tamareira--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="cartao-tamareira--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
