  </pattern>
  <pattern id="cartao-tamareira--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="cartao-tamareira--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
  </pattern>
</defs><g fill="#1B211F"><rect width="1080" height="1350" fill="#FBF9F5"/><rect width="1080" height="380" fill="#0E3B43"/><text class="t" x="64" y="92" font-size="17" font-weight="700" letter-spacing="3.5" fill="#8FD6C8">NATUREZA</text><text class="d" x="64" y="190" font-size="66" fill="#FFFFFF">Matusalém, a</text><text class="d" x="64" y="266" font-size="66" fill="#FFFFFF">semente de Massada</text><line x1="150" x2="150" y1="500" y2="1060" stroke="#D9CCB0" stroke-width="10" stroke-linecap="round"/><circle cx="150" cy="500" r="34" fill="#6B7444" stroke="#FBF9F5" stroke-width="6"/><text class="t n" x="230" y="504" font-size="50" fill="#8C5426">c. 2.000 anos</text><text class="t" x="230" y="552" font-size="26" fill="#2E3633">a idade da semente, pelo radiocarbono</text><circle cx="150" cy="760" r="34" fill="#6B7444" stroke="#FBF9F5" stroke-width="6"/><text class="t n" x="230" y="764" font-size="50" fill="#8C5426">anos 1960</text><text class="t" x="230" y="812" font-size="26" fill="#2E3633">achada nas escavações de Massada</text><circle cx="150" cy="1020" r="34" fill="#6B7444" stroke="#FBF9F5" stroke-width="6"/><text class="t n" x="230" y="1024" font-size="50" fill="#8C5426">2005</text><text class="t" x="230" y="1072" font-size="26" fill="#2E3633">plantada; uma das sementes germinou</text><path d="M880 1150 C870 1000 900 880 890 760" stroke="#8C5426" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M890 760 Q815 730 740 800" stroke="#6B7444" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M890 760 Q965 720 1040 790" stroke="#6B7444" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M890 760 Q830 630 770 700" stroke="#6B7444" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M890 760 Q955 620 1020 690" stroke="#6B7444" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M890 760 Q890 570 890 640" stroke="#6B7444" stroke-width="26" fill="none" stroke-linecap="round"/><line x1="64" x2="1016" y1="1254" y2="1254" stroke="#E4E0D6"/><text class="t" x="64" y="1290" font-size="15" fill="#5F6A66">Fontes: Science News; Associated Press; Guinness World Records</text><text class="t" x="1016" y="1290" font-size="15" font-weight="600" text-anchor="end" fill="#0E3B43">Israel Além do Roteiro · Hebraico Fluente</text></g></svg>