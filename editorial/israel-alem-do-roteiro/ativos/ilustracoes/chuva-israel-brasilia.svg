</defs><g fill="#1B211F"><rect width="1080" height="990" fill="#FBF9F5"/><rect width="1080" height="210" fill="#0E3B43"/><text class="t" x="56" y="66" font-size="15" font-weight="700" letter-spacing="3" fill="#8FD6C8">ISRAEL X BRASIL</text><text class="d" x="56" y="136" font-size="54" fill="#FFFFFF">Quanto chove</text><text class="t" x="56" y="180" font-size="19" fill="#E9DCC0">Um ano inteiro em Israel ao lado de um mês e de um verão em Brasília, em milímetros.</text><text class="t" x="56" y="270" font-size="18" font-weight="700" fill="#0E3B43">Extremo sul de Israel</text><text class="t" x="56" y="292" font-size="15" fill="#5F6A66">o ano inteiro</text><rect x="62" y="316" width="58.2" height="46" rx="6" fill="#D9CCB0"/><rect x="56" y="308" width="58.2" height="46" rx="6" fill="#B9773E" stroke="#8C5426" stroke-width="2" stroke-dasharray="6 5"/><text class="n" x="130.2" y="341" font-size="28" fill="#8C5426">menos de 100 mm</text><text class="t" x="56" y="410" font-size="18" font-weight="700" fill="#0E3B43">Brasília</text><text class="t" x="56" y="432" font-size="15" fill="#5F6A66">só o mês de janeiro</text><rect x="62" y="456" width="119.9" height="46" rx="6" fill="#D9CCB0"/><rect x="56" y="448" width="119.9" height="46" rx="6" fill="#1F8A7D"/><text class="n" x="191.9" y="481" font-size="28" fill="#12665C">206 mm</text><text class="t" x="56" y="550" font-size="18" font-weight="700" fill="#0E3B43">Brasília</text><text class="t" x="56" y="572" font-size="15" fill="#5F6A66">só o verão</text><rect x="62" y="596" width="361.7" height="46" rx="6" fill="#D9CCB0"/><rect x="56" y="588" width="361.7" height="46" rx="6" fill="#1F8A7D"/><text class="n" x="433.7" y="621" font-size="28" fill="#12665C">621,7 mm</text><text class="t" x="56" y="690" font-size="18" font-weight="700" fill="#0E3B43">Alta Galileia, a parte mais chuvosa de Israel</text><text class="t" x="56" y="712" font-size="15" fill="#5F6A66">o ano inteiro</text><rect x="62" y="736" width="640.0" height="46" rx="6" fill="#D9CCB0"/><rect x="56" y="728" width="640.0" height="46" rx="6" fill="#0E3B43"/><text class="n" x="712.0" y="761" font-size="28" fill="#0E3B43">cerca de 1.100 mm</text><rect x="56" y="800" width="968" height="96" rx="16" fill="#F7EFDF"/><text class="t" x="80" y="834" font-size="19" font-weight="600" fill="#8C5426">Um ano de chuva no extremo sul de Israel é menos da metade</text><text class="t" x="80" y="862" font-size="19" font-weight="600" fill="#8C5426">de um só janeiro em Brasília.</text><line x1="56" x2="1024" y1="924" y2="924" stroke="#E4E0D6"/><text class="t" x="56" y="950" font-size="12.5" fill="#5F6A66">Israel: médias anuais de longo prazo (Climate Centre, com dados da FAO; Britannica). Brasília: INMET, médias 1991-2020 da estação de Brasília.</text><text class="t" x="56" y="970" font-size="12.5" fill="#5F6A66">Barras na mesma escala. A barra tracejada é um teto: a média fica abaixo dela. Hebraico Fluente · Israel Além do Roteiro</text></g></svg>