<svg class="fig-chuva-israel-brasilia" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 990" role="img" aria-label="Gráfico de barras: menos de 100 mm por ano no extremo sul de Israel; 206 mm só em janeiro em Brasília; 621,7 mm no verão de Brasília; cerca de 1.100 mm por ano na Alta Galileia."><style>
.fig-chuva-israel-brasilia .t{font-family:'Instrument Sans',system-ui,sans-serif}
.fig-chuva-israel-brasilia .d{font-family:'Literata Display','Literata',Georgia,serif}
.fig-chuva-israel-brasilia .n{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700}
.fig-chuva-israel-brasilia .he{font-family:'Noto Serif Hebrew',serif}
.fig-chuva-israel-brasilia .k{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
</style><defs>
  <marker id="chuva-israel-brasilia--ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9773E"/></marker>
  <pattern id="chuva-israel-brasilia--ondas" width="46" height="22" patternUnits="userSpaceOnUse">
    <rect width="46" height="22" fill="#D3E6E8"/>
    <path d="M3 13 q5.5 -5 11 0 t11 0" fill="none" stroke="#A9CDD2" stroke-width="1.6" stroke-linecap="round"/>
  </pattern>
  <pattern id="chuva-israel-brasilia--hachura" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FBF3E2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#B8862F" stroke-width="2"/>
  </pattern>
  <pattern id="chuva-israel-brasilia--hachura-golan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="7" fill="#F4EEE2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8A6520" stroke-width="1.6"/>
