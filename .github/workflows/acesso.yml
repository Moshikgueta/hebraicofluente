# Dar, tirar e conferir acesso - pelo GitHub, sem terminal.
#
# É a ferramenta de operação da plataforma. Serve para:
#
#   · você mesmo entrar no curso antes de o pagamento estar ligado;
#   · presentear alguém - uma amiga, um aluno beta - mesmo que ela AINDA NÃO
#     tenha conta: o acesso fica guardado pelo e-mail e vira curso no momento
#     do cadastro;
#   · liberar um aluno que pagou por fora (transferência, dinheiro, brinde);
#   · FECHAR o acesso depois de um estorno - que é a metade que todo mundo
#     esquece: devolver o dinheiro na Mercado Pago não tira o curso de
#     ninguém, e sem isto a pessoa estudaria de graça por doze meses;
#   · olhar o que existe no banco quando algo não bate;
#   · ler o MOTIVO de um e-mail de senha não ter saído (ação "envios"). Existe
#     porque /api/health só consegue dizer SE o último envio falhou - a frase
#     que a Resend devolveu ("The domain is not verified", "Invalid from
#     field") fica na trilha, e é ela que diz o que consertar.
#
# Como usar: aba Actions → "Acesso" → Run workflow → escolha a ação, digite o
# e-mail → Run.
#
# Toda execução fica registrada no histórico do Actions, com quem disparou e
# quando. Isso é de propósito: mexer no acesso de alguém tem de deixar rastro.
#
# ⚠ O REPOSITÓRIO É PÚBLICO, E O RESUMO DE CADA EXECUÇÃO TAMBÉM.
# Qualquer pessoa, sem login no GitHub, abre o resumo de uma execução desta
# ação. Por isso NADA aqui imprime um endereço de e-mail inteiro: toda saída
# passa por `mascara`, que reduz `ana.silva@gmail.com` a `a***@gmail.com`.
# O operador reconhece a conta; um estranho não ganha a lista de clientes.
# O e-mail digitado no campo de entrada aparece nos metadados da execução, o
# que não há como esconder num repositório público - a única forma de fechar
# isso é o repositório deixar de ser público.
#
# `environment: producao` deixa o dono exigir aprovação para rodar isto
# (Settings → Environments → producao → Required reviewers). Sem configurar
# nada, não muda nada; configurado, ninguém libera um curso sozinho.

name: Acesso

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        required: true
        default: liberar
        type: choice
        options: [liberar, revogar, consultar, listar, envios, pagamento, pedido, trocar-email, csp]
      email:
        description: 'E-mail da conta (não precisa em "listar", "envios", "pagamento", "pedido" nem "csp")'
        required: false
        type: string
      curso:
        description: 'Curso'
        required: true
        default: alfabetizacao
        type: choice
        options: [alfabetizacao, hebraico-a1, hebraico-a2, hebraico-b1]
      meses:
        description: 'Meses de acesso (só em "liberar"; de 1 a 120)'
        required: false
        default: '12'
        type: string
      pedido:
        description: 'Id do pedido, ou o começo dele, em "pedido"; em "liberar", o id exato do pedido pago (opcional)'
        required: false
        type: string
      novo_email:
        description: 'O e-mail CERTO (só em "trocar-email"; o campo "E-mail" acima é o errado, o de hoje)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  acesso:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # O wrangler do package-lock.json da raiz (auditoria de 01/10/2026,
      # SEC-A-009): versão e dependências conferidas pelo hash do lockfile,
      # e nenhum script de instalação roda num passo com o token no ambiente.
      - name: Instalar o wrangler do lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Executar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACAO: ${{ inputs.acao }}
          EMAIL: ${{ inputs.email }}
          CURSO: ${{ inputs.curso }}
          MESES: ${{ inputs.meses }}
          PEDIDO: ${{ inputs.pedido }}
          NOVO_EMAIL: ${{ inputs.novo_email }}
        run: |
          set -euo pipefail
          # A máscara abaixo usa classes de caracteres, e classes dependem do
          # locale: em `C`, um `é` não é letra e `josé@gmail.com` saía inteiro.
          # O runner hoje vem em C.UTF-8; isto garante que continue.
          export LC_ALL=C.UTF-8

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN não está nos segredos do repositório."
            exit 1
          fi

          # Versão fixa, e com as dependências do lockfile da raiz (o passo
          # acima). `wrangler@4` resolvia para a mais nova a cada execução, com
          # o token da Cloudflare no ambiente - um pacote comprometido rodaria
          # com acesso de escrita ao banco inteiro.
          W="node_modules/.bin/wrangler d1 execute hebraico-fluente --remote"
          say() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          # Primeiro caractere, três asteriscos, domínio. Vale para tudo que
          # sai desta ação - inclusive um corpo de erro da Mercado Pago que
          # cite o e-mail do comprador.
          # Tudo que vem antes de um `@` e não é separador vira `x***`, seja
          # qual for a codificação - uma classe negada casa qualquer byte que
          # não esteja na lista, o que vale para acento em qualquer locale.
          mascara() {
            sed -E 's/([^[:space:]<>",;()|])[^[:space:]<>",;()|]*@/\1***@/g'
          }
          # Roda a consulta e mostra o resultado, mascarado, no resumo.
          mostra() { $W --command "$1" | mascara | tee -a "$GITHUB_STEP_SUMMARY"; }
          # Roda uma escrita. A saída vai só para o log da execução - que num
          # repositório público também é público - e vai mascarada, porque
          # um erro de SQL ecoa o comando, e o comando tem o e-mail dentro.
          grava() { $W --command "$1" | mascara; }

          # O e-mail é normalizado do mesmo jeito que na entrada da plataforma
          # (minúsculas, sem espaços). Sem isto, "Ana@Exemplo.BR " não acha a
          # conta que foi gravada como "ana@exemplo.br" e o operador conclui,
          # erradamente, que ela não existe.
          MAIL="$(printf '%s' "${EMAIL:-}" | tr '[:upper:]' '[:lower:]' | xargs || true)"

          # Aspas simples viram o fim da string no SQL. Dobrar é o escape do
          # SQLite - e um e-mail é entrada de usuário como qualquer outra.
          SQLMAIL="$(printf '%s' "$MAIL" | sed "s/'/''/g")"

          say "## Acesso - \`$ACAO\`"
          say ""

          case "$ACAO" in
            listar)
              say "**Últimas contas** (e-mails mascarados: o resumo é público)"
              say '```'
              mostra "SELECT id, email, datetime(created_at/1000,'unixepoch') AS criada
                        FROM accounts ORDER BY created_at DESC LIMIT 25"
              say '```'
              say ""
              say "**Convites ainda não usados**"
              say '```'
              mostra "SELECT email, course_slug, months AS meses,
                             datetime(created_at/1000,'unixepoch') AS criado_em
                        FROM invites WHERE used_at IS NULL ORDER BY created_at DESC LIMIT 25"
              say '```'
              ;;

            # Um pedido pelo id - ou pelo começo dele.
            #
            # No PIX direto o identificador que aparece no extrato do banco é
            # o começo do id do pedido (25 caracteres). Antes disto não havia
            # como cruzar o extrato com o banco: `consultar` mostrava contas e
            # acessos, nunca pedidos, e `liberar` rodava na palavra de quem
            # dizia ter pago. Agora a pergunta "este PIX de R$ 132,30 é de
            # quem?" tem resposta antes de alguém apertar liberar.
            pedido)
              P="$(printf '%s' "${PEDIDO:-}" | tr -cd 'A-Za-z0-9')"
              [ -n "$P" ] || { echo "::error::Informe o id do pedido (ou o começo dele)."; exit 1; }
              say "**Pedido(s) começando com \`$P\`**"
              say '```'
              mostra "SELECT o.id, o.status, o.amount_cents/100.0 AS valor, o.method AS metodo,
                             datetime(o.created_at/1000,'unixepoch') AS criado,
                             a.email
                        FROM orders o JOIN accounts a ON a.id = o.account_id
                       WHERE o.id LIKE '$P%' ORDER BY o.created_at DESC LIMIT 10"
              say '```'
              say ""
              say "Confere valor, data e conta com o extrato ANTES de liberar."
              ;;

            # Por que o e-mail de senha não saiu.
            #
            # /api/health responde SE o último envio falhou, e só isso - de
            # propósito, porque é uma rota pública e a mensagem de erro da
            # Resend cita o remetente e o domínio. A frase inteira fica na
            # trilha, e é ela que diz o que consertar: "The domain is not
            # verified" pede o passo de DNS, "Invalid from field" pede outro
            # EMAIL_FROM, um 429 pede esperar.
            # O que a regra estrita de scripts, ainda em observação, TERIA
            # bloqueado (auditoria, SEC-003; worker/src/api/csp.js). Semanas
            # com esta tabela vazia são o que autoriza a regra valer.
            csp)
              say "**Relatos da CSP estrita (últimos 30 dias)**"
              say '```'
              mostra "SELECT detail AS relato, COUNT(*) AS vezes,
                             datetime(MAX(created_at)/1000,'unixepoch') AS ultimo
                        FROM access_log
                       WHERE action = 'csp-violacao'
                         AND created_at > (unixepoch() - 30*86400) * 1000
                       GROUP BY detail ORDER BY vezes DESC LIMIT 25"
              say '```'
              say ""
              say "Tabela vazia = nenhum navegador relatou script fora da lista."
              say "Formato: página | diretiva | o que foi bloqueado | começo do trecho."
              ;;

            envios)
              say "**Últimas tentativas de e-mail de senha**"
              say '```'
              mostra "SELECT datetime(created_at/1000,'unixepoch') AS quando,
                             action AS resultado, detail AS motivo
                        FROM access_log
                       WHERE action IN ('forgot-enviado','forgot-falhou')
                       ORDER BY id DESC LIMIT 15"
              say '```'
              say ""
              say "\`forgot-enviado\` = a Resend aceitou. \`forgot-falhou\` = recusou,"
              say "e o motivo está na coluna ao lado."
              say ""
              say "Tabela vazia = ninguém pediu link de senha ainda."
              ;;

            # O pagamento está funcionando? E, quando não está, POR QUÊ?
            #
            # Três perguntas numa ação só, porque quem abre isto está com o
            # checkout na frente e não sabe qual das três é a dele:
            #
            #   1. o PIX/cartão chega a nascer? (`pay-create-failed`)
            #   2. quem resolveu os pagamentos que existiram? (`payment_events`)
            #   3. algum aviso foi recusado por assinatura? (`webhook-bad-signature`)
            #
            # A primeira é a que faltava, e é a mais comum no primeiro dia: a
            # Mercado Pago recusa a criação com um 400 cujo motivo está no
            # corpo da resposta - conta sem chave PIX habilitada, e-mail do
            # comprador inválido, ou o vendedor tentando comprar de si mesmo.
            #
            # As outras duas não exigem teste no painel deles: o tráfego real
            # responde, e a resposta já está gravada.
            #
            #   · `payment_events.source` diz QUEM resolveu cada pagamento.
            #     Uma linha com source='webhook' é a prova de que a assinatura
            #     confere - nenhuma outra coisa cria essa linha. Só 'verify' e
            #     'reconcile' significa que o webhook não está entregando e os
            #     outros dois caminhos estão cobrindo por ele (com atraso de
            #     até cinco minutos, mas sem perder venda).
            #   · `webhook-bad-signature` na trilha é o contrário: a Mercado
            #     Pago bateu à porta e foi recusada. Uma linha dessas é
            #     MP_WEBHOOK_SECRET diferente do que está no painel.
            pagamento)
              say "**Pedidos que nem chegaram a nascer**"
              say '```'
              mostra "SELECT datetime(created_at/1000,'unixepoch') AS quando,
                             detail AS pedido_metodo_e_motivo
                        FROM access_log WHERE action = 'pay-create-failed'
                       ORDER BY id DESC LIMIT 10"
              say '```'
              say ""
              say "Linha aqui = o checkout mostrou erro e nenhum PIX/cartão saiu."
              say "O motivo vem da própria Mercado Pago, no fim da coluna. Os três"
              say "mais comuns no primeiro dia:"
              say ""
              say "· conta sem **chave PIX** habilitada → cadastre uma em"
              say "  mercadopago.com.br → Seu negócio → Configurações → PIX;"
              say "· \`cannot operate between same user\` → você está tentando"
              say "  comprar com o e-mail da SUA conta Mercado Pago. Use outro;"
              say "· \`invalid_payer_email\` → o e-mail da conta do site não é"
              say "  aceito por eles (endereço de teste, domínio inválido)."
              say ""

              say "**Quem resolveu cada pagamento**"
              say '```'
              mostra "SELECT source AS quem, COUNT(*) AS quantos,
                             datetime(MAX(created_at)/1000,'unixepoch') AS mais_recente
                        FROM payment_events GROUP BY source ORDER BY quantos DESC"
              say '```'
              say ""
              say "**Avisos recusados por assinatura errada**"
              say '```'
              mostra "SELECT datetime(created_at/1000,'unixepoch') AS quando,
                             detail AS id_do_pagamento
                        FROM access_log WHERE action = 'webhook-bad-signature'
                       ORDER BY id DESC LIMIT 10"
              say '```'
              say ""
              say "Como ler:"
              say ""
              say "· uma linha \`webhook\` na primeira tabela = assinatura certa,"
              say "  webhook entregando. É a prova, e nada mais a produz."
              say "· só \`verify\` e \`reconcile\` = o webhook não chega, e os outros"
              say "  dois caminhos estão cobrindo. Ninguém fica sem o curso; a"
              say "  liberação demora até cinco minutos em vez de ser imediata."
              say "· qualquer linha na segunda tabela = MP_WEBHOOK_SECRET não bate"
              say "  com a assinatura secreta da aplicação na Mercado Pago."
              say "· as duas vazias = nenhum pagamento passou por aqui ainda."
              ;;

            consultar)
              [ -n "$MAIL" ] || { echo "::error::Informe o e-mail."; exit 1; }
              say "**Conta e acessos**"
              say '```'
              mostra "SELECT a.id, a.email,
                             e.course_slug,
                             datetime(e.expires_at/1000,'unixepoch') AS vence_em,
                             CASE WHEN e.expires_at > unixepoch()*1000 THEN 'ATIVO' ELSE 'vencido' END AS estado
                        FROM accounts a
                        LEFT JOIN entitlements e ON e.account_id = a.id
                       WHERE a.email = '$SQLMAIL'"
              say '```'
              # Sem isto não havia como ver um presente pendente - o convite
              # existia no banco e sumia da vista. "Eu liberei para ela?" é a
              # pergunta seguinte a toda cortesia, e ficava sem resposta.
              say ""
              say "**Convites** (presente aguardando cadastro)"
              say '```'
              mostra "SELECT course_slug, months AS meses,
                             datetime(created_at/1000,'unixepoch') AS criado_em,
                             CASE WHEN used_at IS NULL THEN 'AGUARDANDO CADASTRO'
                                  ELSE 'usado em ' || datetime(used_at/1000,'unixepoch') END AS estado
                        FROM invites WHERE email = '$SQLMAIL'"
              say '```'
              say ""
              say "Nada nas duas tabelas = ninguém com esse e-mail, e nenhum convite."
              # Aparelhos conectados e o rastro de login dividido (29/09/2026,
              # worker/src/lib/aparelhos.js): no máximo três por conta.
              say ""
              say "**Aparelhos conectados** (no máximo 3) **e dias com sinal de login dividido**"
              say '```'
              mostra "SELECT 'aparelho' AS tipo, datetime(p.criado_em/1000,'unixepoch') AS quando
                        FROM aparelhos p JOIN accounts a ON a.id = p.account_id
                       WHERE a.email = '$SQLMAIL'
                      UNION ALL
                      SELECT 'mais de 6 entradas em 24 h', datetime(l.created_at/1000,'unixepoch')
                        FROM access_log l JOIN accounts a ON a.id = l.account_id
                       WHERE a.email = '$SQLMAIL' AND l.action = 'aparelhos-rodizio'
                       ORDER BY 2 DESC LIMIT 20"
              say '```'
              ;;

            liberar)
              [ -n "$MAIL" ] || { echo "::error::Informe o e-mail."; exit 1; }
              M="$(printf '%s' "${MESES:-12}" | xargs || true)"
              [ -n "$M" ] || M=12
              # Só dígitos, e entre 1 e 120. Um zero a mais (1200000000)
              # estourava a conta de milissegundos, virava um número real no
              # banco, e a partir daí TODO login dessa conta respondia 500 -
              # com o portão ainda aberto para ela. E "1e9" ou "-5" não viram
              # 19 ou 5 em silêncio: um erro de digitação é recusado, não
              # reinterpretado.
              case "$M" in
                *[!0-9]*) echo "::error::meses precisa ser um número inteiro (recebi '$M')."; exit 1 ;;
              esac
              if [ "${#M}" -gt 3 ] || [ "$M" -lt 1 ] || [ "$M" -gt 120 ]; then
                echo "::error::meses fora de 1..120 (recebi '$M')."; exit 1
              fi

              # Liberar UM PEDIDO pago (PIX direto, ou um pagamento que o site
              # não viu): o pedido vira pago, o acesso sai com o id dele e o
              # recibo vai por e-mail na varredura seguinte (auditoria de
              # 01/10/2026, PAY-B-005). Antes `liberar` só gravava um acesso
              # 'MANUAL-ACTIONS': o pedido ficava "Aguardando" para sempre em
              # /perfil, a desistência pelo site respondia "não pago" e o
              # aluno não recebia recibo. Sem `pedido`, segue como sempre.
              P="$(printf '%s' "${PEDIDO:-}" | tr -cd 'A-Za-z0-9_-')"
              if [ -n "$P" ]; then
                # O pedido existe, é desta conta, e em que estado está?
                ESTADO="$($W --json --command "SELECT o.status AS s, o.course_slug AS c FROM orders o
                            JOIN accounts a ON a.id = o.account_id
                           WHERE o.id = '$P' AND a.email = '$SQLMAIL'" 2>&1 | mascara)"
                ST="$(printf '%s' "$ESTADO" | grep -o '"s": *"[a-z]*"' | head -1 | sed 's/.*"\([a-z]*\)"$/\1/')"
                PC="$(printf '%s' "$ESTADO" | grep -o '"c": *"[a-z0-9-]*"' | head -1 | sed 's/.*"\([a-z0-9-]*\)"$/\1/')"
                [ -n "$ST" ] || { echo "::error::Não existe pedido $P nesta conta. Confira com 'pedido' (id) e 'consultar' (e-mail)."; exit 1; }
                case "$ST" in
                  paid) say "O pedido \`$P\` **já estava pago**. Nada mudou."; exit 0 ;;
                  refunded) echo "::error::O pedido $P foi estornado. Não dá para liberar um pedido devolvido."; exit 1 ;;
                esac
                [ "$PC" = "$CURSO" ] || say "O pedido é do curso **$PC** (o campo Curso dizia $CURSO): vale o do pedido."
                grava "$(bash scripts/sql-liberar-pedido.sh "$P" "$SQLMAIL" "$M")"
                say "Pedido \`$P\` marcado como **pago** e **$PC** liberado por **$M meses** para \`$(printf '%s' "$MAIL" | mascara)\`."
                say "Se a conta já tinha acesso valendo, os meses foram somados ao prazo que restava."
                say "O recibo sai por e-mail na varredura seguinte (até 5 minutos)."
                say ""
                say '```'
                mostra "SELECT o.id, o.status, o.provider, a.email, e.course_slug,
                               datetime(e.expires_at/1000,'unixepoch') AS vence_em
                          FROM orders o JOIN accounts a ON a.id = o.account_id
                          LEFT JOIN entitlements e ON e.account_id = a.id AND e.course_slug = o.course_slug
                         WHERE o.id = '$P'"
                say '```'
                exit 0
              fi

              # A conta existe? Decide o caminho abaixo.
              #
              # Antes, o convite era gravado SEMPRE, mesmo para quem já tinha
              # conta e acabara de receber o acesso. No login seguinte o
              # convite pendente era resgatado e ESTENDIA o prazo de novo:
              # 12 meses liberados, 24 entregues. Agora: conta existente
              # recebe o acesso; conta inexistente recebe o convite. Um ou
              # outro, nunca os dois.
              EXISTE="$($W --json --command "SELECT COUNT(*) AS n FROM accounts WHERE email = '$SQLMAIL'" 2>&1 \
                        | mascara | grep -o '"n": *[0-9]*' | head -1 | tr -cd '0-9')"
              [ -n "$EXISTE" ] || { echo "::error::Não consegui consultar a conta."; exit 1; }

              if [ "$EXISTE" != "0" ]; then
                # ON CONFLICT porque a chave é (conta, curso): liberar duas
                # vezes ESTENDE o prazo em vez de criar uma segunda linha.
                # Estende A PARTIR DO VENCIMENTO quando o acesso ainda vale:
                # antes era "agora + M", e um aluno pagante com 10 meses pela
                # frente que ganhava 1 mês de cortesia ficava com 1 (auditoria
                # de 28/09, PAY-007). Vencido, conta a partir de agora. Acesso
                # sem vencimento (NULL) continua sem vencimento.
                grava \
                  "INSERT INTO entitlements (account_id, course_slug, granted_at, expires_at, order_id)
                   SELECT id, '$CURSO', unixepoch()*1000,
                          unixepoch()*1000 + $M * 2629800000, 'MANUAL-ACTIONS'
                     FROM accounts WHERE email = '$SQLMAIL'
                   ON CONFLICT(account_id, course_slug) DO UPDATE SET
                     expires_at = CASE
                       WHEN entitlements.expires_at IS NULL THEN NULL
                       ELSE MAX(entitlements.expires_at, unixepoch()*1000) + $M * 2629800000
                     END;
                   INSERT INTO access_log (account_id, action, detail, created_at)
                   SELECT id, 'grant-manual', '$CURSO via GitHub Actions', unixepoch()*1000
                     FROM accounts WHERE email = '$SQLMAIL';
                   DELETE FROM invites
                    WHERE email = '$SQLMAIL' AND course_slug = '$CURSO' AND used_at IS NULL"
              else
                # A conta ainda não existe: o acesso fica guardado pelo E-MAIL,
                # que é o que torna possível presentear alguém que ainda nem
                # ouviu falar do site.
                #
                # O convite NÃO vira curso sozinho quando a pessoa se cadastra.
                # Virava, e era o furo F-18 da auditoria: bastava saber que um
                # endereço foi presenteado para chegar na frente e levar o
                # curso. Agora o cadastro manda um e-mail para SUPPORT_EMAIL
                # avisando, e é rodar `liberar` de novo - aí a conta existe e o
                # acesso é concedido direto, pelo ramo de cima.
                grava \
                  "INSERT INTO invites (email, course_slug, months, note, created_at)
                   VALUES ('$SQLMAIL', '$CURSO', $M, 'GitHub Actions', unixepoch()*1000)
                   ON CONFLICT(email, course_slug) DO UPDATE SET
                     months = excluded.months, created_at = excluded.created_at,
                     used_at = NULL"
              fi

              say "Liberado **$CURSO** por **$M meses** para \`$(printf '%s' "$MAIL" | mascara)\`."
              say "Se a conta já tinha acesso valendo, os meses foram somados ao prazo que restava."
              say ""
              say '```'
              mostra "SELECT a.email, e.course_slug,
                             datetime(e.expires_at/1000,'unixepoch') AS vence_em
                        FROM accounts a JOIN entitlements e ON e.account_id = a.id
                       WHERE a.email = '$SQLMAIL' AND e.course_slug = '$CURSO'"
              say '```'
              say ""
              say "Tabela vazia acima significa que a conta ainda não existe -"
              say "e está tudo certo: o convite ficou guardado. Peça para ela"
              say "criar a conta com **esse mesmo e-mail**."
              say ""
              say "Quando ela se cadastrar, você recebe um e-mail avisando, e aí"
              say "roda este \`liberar\` outra vez - aí sim o curso é concedido."
              say "O convite não vira curso sozinho de propósito: bastaria alguém"
              say "saber o endereço presenteado para chegar na frente e levá-lo."
              ;;

            # Corrigir o e-mail de uma conta (auditoria de 28/09, OPS-001).
            #
            # Quem digita o e-mail errado no cadastro e paga fica sem recibo,
            # sem link de senha e sem como corrigir sozinho: o site não troca
            # e-mail, de propósito (trocar e-mail sem prova de posse é como se
            # rouba conta). Aqui a troca é feita pelo dono, DEPOIS de confirmar
            # com o aluno por outro canal (WhatsApp, o e-mail certo) que a
            # conta é dele. Compras, acesso e progresso ficam na mesma conta;
            # só o endereço muda. O e-mail novo entra NÃO confirmado: o aviso
            # de confirmação aparece para o aluno no próximo acesso.
            trocar-email)
              [ -n "$MAIL" ] || { echo "::error::Informe no campo E-mail o endereço de HOJE (o errado)."; exit 1; }
              NOVO="$(printf '%s' "${NOVO_EMAIL:-}" | tr '[:upper:]' '[:lower:]' | xargs || true)"
              [ -n "$NOVO" ] || { echo "::error::Informe o e-mail certo no campo novo_email."; exit 1; }
              # A mesma forma que o cadastro aceita: algo@algo.algo, sem espaço
              # nem caractere de controle, até 254 caracteres.
              if ! printf '%s' "$NOVO" | grep -qE '^[^@[:space:][:cntrl:]]+@[^@[:space:][:cntrl:]]+\.[^@[:space:][:cntrl:]]+$' \
                 || [ "${#NOVO}" -gt 254 ]; then
                echo "::error::O e-mail novo não tem a forma de um endereço (recebi '$(printf '%s' "$NOVO" | mascara)')."; exit 1
              fi
              [ "$NOVO" != "$MAIL" ] || { echo "::error::Os dois e-mails são iguais."; exit 1; }
              SQLNOVO="$(printf '%s' "$NOVO" | sed "s/'/''/g")"
              conta() {
                $W --json --command "SELECT COUNT(*) AS n FROM accounts WHERE email = '$1'" 2>&1 \
                  | mascara | grep -o '"n": *[0-9]*' | head -1 | tr -cd '0-9'
              }
              ANTIGA="$(conta "$SQLMAIL")"; JA_USADO="$(conta "$SQLNOVO")"
              [ -n "$ANTIGA" ] && [ -n "$JA_USADO" ] || { echo "::error::Não consegui consultar as contas."; exit 1; }
              [ "$ANTIGA" = "1" ] || { echo "::error::Não existe conta com o e-mail de hoje. Confira com 'consultar'."; exit 1; }
              if [ "$JA_USADO" != "0" ]; then
                echo "::error::Já existe uma conta com o e-mail novo. Duas contas não podem ter o mesmo e-mail;"
                echo "::error::confira com 'consultar' qual delas tem a compra antes de decidir."
                exit 1
              fi
              grava \
                "UPDATE accounts SET email = '$SQLNOVO' WHERE email = '$SQLMAIL';
                 -- Links de senha pedidos para o endereço errado deixam de valer.
                 UPDATE password_resets SET used_at = unixepoch()*1000
                  WHERE used_at IS NULL
                    AND account_id = (SELECT id FROM accounts WHERE email = '$SQLNOVO');
                 INSERT INTO access_log (account_id, action, detail, created_at)
                 SELECT id, 'email-trocado', 'via GitHub Actions', unixepoch()*1000
                   FROM accounts WHERE email = '$SQLNOVO'"
              say "E-mail trocado: \`$(printf '%s' "$MAIL" | mascara)\` → \`$(printf '%s' "$NOVO" | mascara)\`."
              say ""
              say "Compras, acesso e progresso continuam na mesma conta. A senha não muda."
              say "Diga ao aluno para entrar com o e-mail novo; se não lembrar a senha,"
              say "\"Esqueci minha senha\" agora manda o link para o endereço certo."
              ;;

            revogar)
              [ -n "$MAIL" ] || { echo "::error::Informe o e-mail."; exit 1; }
              grava \
                "INSERT INTO access_log (account_id, action, detail, created_at)
                 SELECT id, 'revoke-manual', '$CURSO via GitHub Actions', unixepoch()*1000
                   FROM accounts WHERE email = '$SQLMAIL';
                 DELETE FROM entitlements
                  WHERE course_slug = '$CURSO'
                    AND account_id = (SELECT id FROM accounts WHERE email = '$SQLMAIL');
                 -- O convite pendente morre junto. Sem isto, revogar e a
                 -- pessoa se cadastrar depois devolveria o acesso - o
                 -- convite ainda estaria lá, esperando.
                 DELETE FROM invites
                  WHERE email = '$SQLMAIL' AND course_slug = '$CURSO' AND used_at IS NULL"
              say "Acesso a **$CURSO** removido de \`$(printf '%s' "$MAIL" | mascara)\`."
              say ""
              say "Fecha na hora: o cookie de sessão não carrega direito nenhum,"
              say "então não há atraso até ele expirar."
              ;;
          esac
