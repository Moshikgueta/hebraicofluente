# O relatório do teste A/B do hero da capa (28/09/2026).
#
# Como usar: aba Actions → "Relatório do teste A/B" → Run workflow → Run.
# O resultado aparece no resumo da execução: quantos visitantes viram cada
# versão do hero, clicaram no botão, chegaram ao checkout e compraram, e se a
# diferença já é confiável.
#
# Só lê. Os números são totais por dia e versão (worker/src/api/ab.js): não há
# e-mail, conta nem IP na tabela. O repositório é público, e o resumo também:
# qualquer pessoa vê estes totais, inclusive o número de compras de cada lado.

name: Relatório do teste A/B

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # O wrangler do package-lock.json da raiz (auditoria de 01/10/2026,
      # SEC-A-009): versão e dependências conferidas pelo hash do lockfile,
      # e nenhum script de instalação roda num passo com o token no ambiente.
      - name: Instalar o wrangler do lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Ler as contagens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN não está nos segredos do repositório."
            exit 1
          fi
          # O wrangler do lockfile, como em acesso.yml: o token tem acesso ao banco.
          node_modules/.bin/wrangler d1 execute hebraico-fluente --remote --json --command \
            "SELECT variante, evento, SUM(n) AS n FROM ab_contagens WHERE exp = 'hero-2026-09' GROUP BY variante, evento" \
            > contagens.json
          node tools/relatorio-ab.mjs < contagens.json | tee -a "$GITHUB_STEP_SUMMARY"
