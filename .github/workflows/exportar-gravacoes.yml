# Exportar gravações do painel para o git.
#
# O painel /admin/gravar guarda cada pronúncia no banco (D1), e o site já
# toca de lá. Esta ação traz tudo para `audio/<id>.mp3`, com o mesmo
# acabamento dos clipes do estúdio (tools/exportar-gravacoes.mjs), num ramo
# novo - para conferir num PR antes de entrar em `main`.
#
# Como usar: aba Actions → "Exportar gravações do painel" → Run workflow.
# No fim, o resumo da execução diz o nome do ramo; abra um PR dele para main.
#
# ⚠ O repositório é público: o que entra em audio/ fica visível para todos,
# como os clipes que já estão lá.

name: Exportar gravações do painel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exportar-gravacoes
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: O tratamento funciona? (ensaio, sem banco)
        run: node tools/exportar-gravacoes.mjs --ensaiar

      - name: Exportar do D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/exportar-gravacoes.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar num ramo novo
        run: |
          RAMO="gravacoes-do-painel-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMO"
          git add audio/*.mp3
          if git diff --cached --quiet; then
            echo "Nada mudou em audio/: as gravações do painel já estão no git." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          N=$(git diff --cached --name-only | wc -l)
          git commit -q -m "Áudio: $N clipe(s) exportado(s) do painel de gravação"
          git push -q origin "$RAMO"
          echo "Ramo **$RAMO** com $N clipe(s). Abra um PR dele para main." >> "$GITHUB_STEP_SUMMARY"
