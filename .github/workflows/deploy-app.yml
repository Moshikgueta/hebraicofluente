# Publica a PRÉVIA da plataforma no GitHub Pages.
#
# ⚠ Esta NÃO é a implantação de produção. Ela existe para revisar a interface
# inteira - site, catálogo, telas de conta e de checkout - sem Cloudflare, sem
# banco e sem chave de pagamento.
#
# Sem NEXT_PUBLIC_PLATFORM_API, o app usa o adaptador local: contas e pedidos
# ficam no navegador de quem abre, nada é cobrado, e uma tarja diz isso em toda
# página (app/src/components/shell/DemoNotice.tsx). O portão de rota aqui é só
# do lado do cliente - não há Worker para aplicá-lo.
#
# A produção é .github/workflows/deploy-worker.yml (Cloudflare Workers + D1 +
# Mercado Pago).
#
# `npm run build` regenera app/content/ a partir de data/ antes de tudo, que é
# por que o diretório de conteúdo está no .gitignore: o site sai sempre da
# mesma fonte que o livro impresso.
#
# NEXT_PUBLIC_BASE_PATH is what makes a project page work. Pages serves this at
# /hebraicofluente, and every URL the app builds by hand - an audio clip, a
# stroke-order SVG - needs that prefix. Fonts go through next/font/local so Next
# rewrites them; a hand-written url('/fonts/…') in CSS would 404.

name: Deploy app to Pages

on:
  push:
    branches: [claude/practical-babbage-veufcz, main]
    paths:
      - 'app/**'
      - 'data/**'
      - 'assets/**'
      - 'tools/export-content.mjs'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes a waiting one but never
# cancels a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # The tests are the gate. The order rule in particular: a broken build
      # that still deploys would put a lesson in front of a learner with a
      # letter they have not been taught.
      - name: Test
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        env:
          NEXT_PUBLIC_BASE_PATH: /hebraicofluente
        run: npm run build

      # Jekyll would otherwise swallow Next's _next/ directory.
      - run: touch app/out/.nojekyll

      # Pages has to be switched on once, by hand, in the repository settings:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      #
      # `enablement: true` asks the action to do it, but the workflow's
      # GITHUB_TOKEN cannot create a Pages site - that needs repo-admin rights
      # the token is not granted. So the first run of this workflow fails with
      # "Resource not accessible by integration" until the switch is flipped,
      # and every run after it succeeds. Left in place because it costs nothing
      # once Pages exists: the action finds the site and never tries to create.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
