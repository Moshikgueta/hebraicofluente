name: Fotos das missões
# Busca no Wikimedia Commons as fotos candidatas das missões e as devolve ao
# ramo que pediu, em fotos-candidatas/missoes/ (tools/fotos-missoes-buscar.mjs).
# Roda quando o pedido muda num ramo do Claude, ou à mão. Nada vai ao ar daqui.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/fotos-missoes-pedido.json']
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/fotos-missoes-buscar.mjs
      - name: Devolver as candidatas ao ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos-candidatas/missoes
          git commit -m "Fotos candidatas das missões (Wikimedia Commons)" || exit 0
          git push
