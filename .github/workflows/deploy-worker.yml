# Publica a PLATAFORMA no Cloudflare Workers.
#
# É esta a implantação de produção: o Worker serve o site, responde a /api/*,
# guarda contas e pedidos no D1 e fala com a Mercado Pago.
#
# A outra (deploy-app.yml → GitHub Pages) continua existindo e publica a mesma
# interface em MODO DEMONSTRAÇÃO, sem servidor. As duas não se atropelam
# porque a diferença é uma variável de build: NEXT_PUBLIC_PLATFORM_API.
#
# ── O QUE PRECISA EXISTIR ─────────────────────────────────────────────────
#
# Só isto, nos segredos DESTE repositório (Settings → Secrets and variables →
# Actions → aba Secrets):
#
#   CLOUDFLARE_API_TOKEN    modelo "Edit Cloudflare Workers" MAIS a permissão
#                           D1:Edit - sem ela o Worker sobe e o banco falha
#   CLOUDFLARE_ACCOUNT_ID   opcional hoje: o script deriva a conta do próprio
#                           token, e um id divergente é ignorado com aviso
#
# O resto é feito por scripts/cloudflare-setup.sh a cada execução: criar o
# banco, aplicar o esquema, gerar o SESSION_SECRET, publicar, acertar o
# SITE_ORIGIN e conferir o que subiu.
#
# Sem o token o job não roda: ele verifica, explica na tabela do resumo o que
# falta, e para - em vez de falhar no meio com um erro do wrangler.
#
# Para COBRAR, faltam dois segredos nos segredos DESTE repositório:
# MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET, com o webhook da Mercado Pago apontado
# para /api/pay/webhook. Sem eles o site funciona inteiro e só o checkout fica
# desligado, dizendo isso na tela.
#
# Para RECUPERAR SENHA, falta RESEND_API_KEY, no mesmo lugar. Sem ela o link
# de "esqueci minha senha" não é entregue a ninguém, e /api/health reporta
# "email": false. Ver .env.example.

name: Deploy platform to Cloudflare

on:
  push:
    # SÓ `main`. Produção tem um ramo, e é este.
    # ────────────────────────────────────────────────────────────────────────
    # Até 20/09/2026 o ramo de trabalho também publicava, e enquanto havia uma
    # pessoa só isso era conveniência. Deixa de ser no dia em que houver
    # outra: com dois ramos publicando, escrever no repositório É publicar em
    # produção e alcançar o banco, sem revisão e sem etapa intermediária.
    #
    # O fluxo agora tem um passo a mais, e o passo é o ponto: trabalha-se no
    # ramo de sempre, e RELEASE é fundir em `main`. Ver "Publicar" em
    # DEPLOY-CLOUDFLARE.md.
    #
    # `main` protegido contra force-push e apagamento é a outra metade, e é
    # clique no painel do GitHub (Settings → Branches) - a API de proteção não
    # é alcançável de onde este repositório é mantido.
    branches: [main]
    paths:
      - 'app/**'
      - 'data/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'tools/export-content.mjs'
      # A publicação É feita por estes scripts (os passos "Mercado Pago
      # autentica?" e "Publicar e configurar"), então mexer neles tem de
      # disparar uma publicação - senão uma correção no próprio caminho do
      # deploy fica parada sem ninguém perceber.
      #
      # A pasta inteira, e não um arquivo por nome: quando isto listava só o
      # `cloudflare-setup.sh`, o `pagamento-ativo.mjs` nasceu de fora da lista
      # e a correção dele não publicou nada. O push ficou verde, o Actions
      # ficou quieto, e o script antigo seguiu no ar - que é a forma mais cara
      # de errar, porque não parece erro nenhum.
      - 'scripts/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# A versão do Playwright que as conferências em navegador instalam, fixa.
# ─────────────────────────────────────────────────────────────────────────
# Auditoria de 24/09/2026. Era `npm install --no-save playwright`, sem
# versão e fora do lockfile, em três passos - dois deles ANTES de "Publicar e
# configurar", que recebe o token da Cloudflare, o da Mercado Pago e a chave
# da Resend. Um pacote instalado roda código no job: ele pode escrever em
# $GITHUB_ENV (um NODE_OPTIONS, por exemplo) e esse código passa a rodar em
# todo passo seguinte, segredos incluídos. Sem versão, a primeira versão
# maliciosa publicada do Playwright entraria na publicação seguinte sozinha.
#
# Fixa, ela não muda mais: a npm não deixa republicar uma versão existente.
# `--ignore-scripts` fecha o resto - nenhum pacote dessa instalação roda
# script de instalação; o navegador vem do `playwright install` explícito.
# Para subir de versão: troque aqui, de preferência para uma que já tenha
# semanas de publicada, e confira que as três etapas continuam verdes.
env:
  PLAYWRIGHT_VERSION: 1.63.0

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Não só "tem ou não tem": DIZ o que está errado.
      #
      # A tela de segredos do GitHub tem duas abas, *Secrets* e *Variables*, e
      # colar na errada é o engano mais comum que existe ali - o valor fica
      # salvo, visível, com o nome certo, e o workflow não enxerga. Como
      # `vars.X` e `secrets.X` são espaços separados, dá para detectar
      # exatamente esse caso e dizer o que fazer.
      #
      # Nada aqui imprime valor de segredo: só presença e comprimento, que é o
      # bastante para achar um token truncado na hora de colar.
      - name: Há credencial da Cloudflare?
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_AS_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
          ACCT_AS_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "## Credenciais"
            echo
            echo "| Segredo | Estado |"
            echo "|---|---|"
            if [ -n "$TOKEN" ]; then
              echo "| \`CLOUDFLARE_API_TOKEN\` | ✅ presente (${#TOKEN} caracteres) |"
            elif [ -n "$TOKEN_AS_VAR" ]; then
              echo "| \`CLOUDFLARE_API_TOKEN\` | ⚠️ está na aba **Variables**, não em **Secrets** |"
            else
              echo "| \`CLOUDFLARE_API_TOKEN\` | ❌ ausente |"
            fi
            if [ -n "$ACCT" ]; then
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ✅ presente (${#ACCT} caracteres) |"
            elif [ -n "$ACCT_AS_VAR" ]; then
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ⚠️ está na aba **Variables**, não em **Secrets** |"
            else
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ❌ ausente |"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$TOKEN_AS_VAR" ] || [ -n "$ACCT_AS_VAR" ]; then
            {
              echo "A tela de segredos tem duas abas. O valor foi colado em **Variables**,"
              echo "e o workflow lê **Secrets**. Vá em Settings → Secrets and variables →"
              echo "Actions → aba **Secrets** → *New repository secret*, e cole lá."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::A credencial está na aba Variables. Mova para Secrets."
          fi

          # Um token da Cloudflare tem 40 caracteres; o Account ID, 32 hex. Um
          # valor muito curto quase sempre é cópia pela metade.
          if [ -n "$TOKEN" ] && [ "${#TOKEN}" -lt 20 ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN tem só ${#TOKEN} caracteres - parece truncado."
          fi
          if [ -n "$ACCT" ] && [ "${#ACCT}" -ne 32 ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID tem ${#ACCT} caracteres; o esperado são 32."
          fi

          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem CLOUDFLARE_API_TOKEN - publicação pulada. Ver o resumo desta execução."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: npm ci

      # ANTES do build, porque é o build que congela esta decisão nas páginas.
      #
      # `pagamento.modo` em data/empresa.json diz como se QUER cobrar; este
      # passo resolve o que DÁ para cobrar agora, perguntando à Mercado Pago
      # se a credencial publicada autentica. Com o modo em `mercadopago` e um
      # token que devolve 401 - o caso real deste repositório, onde o segredo
      # é quase certamente a Public Key - toda compra morre num "alguma coisa
      # quebrou do nosso lado", e a loja fica de pé sem vender nada.
      #
      # O arquivo resolvido é lido pelos DOIS lados, e é esse o motivo de o
      # passo estar aqui: o build do site, que decide o que oferecer, e o
      # bundle do Worker, que decide o que criar. Uma página oferecendo cartão
      # enquanto o servidor só sabe fazer PIX é o defeito silencioso que este
      # projeto não aceita.
      #
      # A escrita vale só para esta execução, nunca é commitada: o repositório
      # continua dizendo o que se quer, e no dia em que o Access Token certo
      # entrar no segredo a publicação seguinte religa a Mercado Pago sozinha.
      # Os testes são o portão. A regra de ordem em particular: uma versão
      # quebrada que ainda assim publicasse poria uma lição na frente de um
      # aluno com uma letra que ele não aprendeu. E agora também o que decide
      # preço e acesso (tests/platform.test.ts, tests/worker.test.ts).
      #
      # E vêm ANTES da sonda da Mercado Pago, de propósito.
      # ────────────────────────────────────────────────────────────────────
      # A sonda reescreve data/empresa.json para ESTA execução, com o que a
      # conta aceita hoje. Rodando ela primeiro, a suíte passava a testar o
      # estado da conta do provedor em vez do nosso código: no dia em que o
      # PIX saiu de lá, os testes de pagamento - que criam pedidos PIX -
      # começaram a falhar sem que uma linha de código tivesse mudado, e a
      # publicação parou por um motivo que não era um defeito.
      # Testes testam o código, contra o arquivo do repositório, que diz a
      # intenção. A sonda resolve a realidade da implantação, e o que ela
      # escreve é para o BUILD, logo abaixo.
      - name: Test
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: npm test

      - name: Mercado Pago autentica?
        if: steps.guard.outputs.ok == 'true'
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: node scripts/pagamento-ativo.mjs

      # NEXT_PUBLIC_PLATFORM_API=worker é o que faz o app falar com /api/* em
      # vez do adaptador local. Sem isto, a plataforma publicada guardaria
      # contas no navegador de cada visitante - com uma tarja dizendo isso,
      # mas ainda assim errado.
      # O SITE_ORIGIN sai do wrangler.toml e entra no build.
      # ────────────────────────────────────────────────────────────────────
      # É o que faz do arquivo o ÚNICO lugar com o domínio: o Worker já o lia
      # de lá, e agora os canonicals e os og:url do HTML também. Trocar de
      # domínio é uma edição. `checa-seo.mjs` reprova se os dois divergirem,
      # que é o que aconteceria se este `export` sumisse - o Next cairia no
      # padrão embutido em lib/seo.ts e passaria a anunciar o domínio velho.
      - name: Build (modo plataforma)
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        env:
          NEXT_PUBLIC_PLATFORM_API: worker
        run: |
          NEXT_PUBLIC_SITE_ORIGIN="$(sed -n 's/^[[:space:]]*SITE_ORIGIN[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' ../wrangler.toml | head -1)"
          echo "SITE_ORIGIN do wrangler.toml: ${NEXT_PUBLIC_SITE_ORIGIN:-(não encontrado)}"
          test -n "$NEXT_PUBLIC_SITE_ORIGIN"
          export NEXT_PUBLIC_SITE_ORIGIN
          npm run build

      # O curso não pode viajar no pacote público, e só o arquivo PUBLICADO
      # responde isso.
      # ────────────────────────────────────────────────────────────────────
      # Até 20/09/2026 o material de ensino ia inteiro para dentro do
      # JavaScript que a home carrega, e um `curl` naquele endereço levava o
      # produto sem conta e sem pagar. O conserto foi tirar o conteúdo do
      # pacote e pô-lo atrás de /api/content (worker/src/api/content.js).
      #
      # A suíte prova a fonte; este passo prova o resultado, que é onde o
      # defeito de verdade mora: basta um import estático novo, ou um ramo que
      # o empacotador deixou de podar, para o vazamento voltar sem que uma
      # linha de teste mude. Roda DEPOIS do build e ANTES de publicar - é a
      # última porta antes de o pacote ir para o ar.
      #
      # Falha derruba a publicação de propósito: publicar o curso de graça é
      # pior do que não publicar.
      - name: O pacote público não leva o curso
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: |
          set -o pipefail
          echo "## O conteúdo pago está fora do pacote?" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `|| rc=$?` porque o shell do Actions roda com `-e`: sem isso, a
          # falha aborta o passo aqui e o resumo fica com a cerca aberta,
          # escondendo justamente o relatório que diz o que vazou.
          rc=0
          node pacote.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # A vitrine não pode prometer o que o curso não entrega.
      # ────────────────────────────────────────────────────────────────────
      # Em 21/09/2026 o site vendia um áudio que não existe: o manifesto de
      # gravações estava vazio, o curso desligava os exercícios de escuta, o FAQ
      # dizia a verdade - e a seção que vende listava "Áudio gravado por falante
      # nativo" como coisa entregue. No Brasil a oferta vincula, então isso não
      # é detalhe de texto: é reembolso que o comprador tem razão em pedir.
      #
      # Roda contra o HTML PUBLICADO, e não contra a fonte, pelo mesmo motivo do
      # passo acima: o que vende é o que foi publicado. O texto das abas que só
      # aparecem ao clicar é coberto por tests/vitrine.test.ts, na suíte.
      - name: A vitrine não promete o que não existe
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: |
          set -o pipefail
          echo "## A vitrine e o produto dizem a mesma coisa?" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          node promessas.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Duas páginas livres já anunciaram números diferentes para a mesma
      # coisa - "21 lições" na capa e "22 lições" no FAQ, no checkout e em
      # /cursos - porque a contagem de LETRAS foi usada como contagem de
      # LIÇÕES. Cada arquivo estava coerente consigo mesmo, então nenhum teste
      # de unidade viu; o defeito só existe olhando duas páginas juntas, que é
      # o que um comprador faz. Este passo olha o HTML publicado inteiro.
      - name: A vitrine anuncia os números do curso
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: |
          set -o pipefail
          echo "## Os números anunciados batem com o curso?" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          node numeros.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # O sitemap e o robots são GERADOS a cada publicação, das rotas que o
      # build de fato produziu e do `GATED` do portão. Nenhuma lista escrita à
      # mão: uma rota nova do curso nasce fora do índice pelo mesmo motivo que
      # nasce atrás do login. O checador roda logo depois e reprova qualquer
      # divergência entre o sitemap, o HTML publicado e o SITE_ORIGIN.
      - name: Sitemap, robots e Open Graph
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: |
          set -o pipefail
          echo "## O que o site anuncia a buscador e a rede social" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          { node seo.mjs && node checa-seo.mjs; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Num navegador de verdade, e ANTES de publicar.
      #
      # É o único passo que vê a camada de acessibilidade funcionar: entre o
      # atributo carimbado no <html> e o pixel que muda há a cascata do
      # Tailwind, um seletor escrito errado e um `zoom` que pode não pegar -
      # e nada disso aparece em teste de unidade. Uma regressão aqui é
      # invisível para todo mundo que não precisa do recurso, que é
      # justamente por que ela ficaria no ar.
      #
      # Custa um minuto de instalação do Chromium por publicação. O passo
      # depois deste sobe o site; este é a última chance de barrar.
      - name: A acessibilidade funciona num navegador?
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: |
          set -o pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}" >/dev/null 2>&1
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium >/dev/null 2>&1
          echo "## Tamanho do texto, contraste, espaçamento e o olho da senha" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          node a11y.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # As páginas públicas, CLICADAS.
      #
      # Roda aqui, contra a build de plataforma, porque é essa que vai ao ar e
      # porque as páginas livres são as mesmas nos dois modos - ao contrário
      # do `tom.mjs` logo abaixo, que precisa entrar no curso.
      #
      # O que ele cobre não é coberto por mais nada no fluxo: `varrer-site`
      # CARREGA as páginas, e a capa carrega perfeitamente mesmo quando um
      # clique numa aba derruba a árvore inteira do React. Foi assim que a aba
      # «Escrita» chegou à produção transformando a página de vendas em
      # «Application error» - verde em tudo, quebrada no primeiro toque.
      - name: As páginas públicas sobrevivem a ser usadas?
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: |
          set -o pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}" >/dev/null 2>&1
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium >/dev/null 2>&1
          echo "## Todo controle de toda página livre, em desktop e celular" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          node clique.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # POR QUE `tom.mjs` NÃO ESTÁ AQUI.
      # ────────────────────────────────────────────────────────────────────
      # Ele confere o tom das telas do CURSO ("hebraico é super fácil!") e o
      # tamanho delas, e para isso precisa entrar no curso. Neste ponto do
      # fluxo o out/ é a build de PLATAFORMA, onde essas rotas estão atrás do
      # portão e devolvem a tela de entrar - um verificador de tom apontado
      # para telas de login não acha nada e passa.
      #
      # Passar sem ter olhado é pior do que não existir, porque alguém confia
      # no verde. Então ele roda contra a build local, com `npm run tom`,
      # junto de `npm run exercicios` - e recusa, com mensagem explícita, um
      # out/ em que não consegue abrir o curso.

      # Publicar É o script de configuração, e não um `wrangler deploy` seco.
      #
      # A diferença importa: um deploy seco pressupõe que o banco existe, que o
      # database_id no wrangler.toml é o certo, que o esquema foi aplicado e
      # que o SESSION_SECRET está definido - e falha de forma obscura quando
      # qualquer um desses pressupostos não vale. O script CONFERE cada um e
      # cria o que faltar. Resultado: a primeira publicação de uma conta nova
      # funciona sem ninguém abrir um terminal.
      #
      # Ele é idempotente, então nas publicações seguintes os passos 1-4 só
      # confirmam o que já existe e seguem adiante.
      #
      # O CLOUDFLARE_API_TOKEN vai no ambiente porque o wrangler o lê de lá
      # sozinho - é assim que a mesma linha serve à máquina de alguém (onde a
      # credencial vem do `wrangler login`) e ao CI.
      - name: Publicar e configurar
        id: deploy
        if: steps.guard.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Os segredos da Mercado Pago vivem AQUI, nos segredos deste
          # repositório, e o script os empurra para o Worker a cada
          # publicação. Assim há um lugar só para guardar chave, e rotacionar
          # uma é editar e dar push - em vez de abrir dois painéis e lembrar
          # qual está com o valor velho.
          #
          # Vazios enquanto a conta não existir: o site sobe inteiro e só o
          # checkout fica desligado, dizendo isso na tela.
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          # A chave da Resend, pela mesma porta. Vazia, o site sobe inteiro e
          # "esqueci minha senha" não entrega o link - /api/health reporta
          # "email": false. Onde conseguir está em .env.example.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # O build já aconteceu no passo anterior, com o cache do npm, para
          # que uma falha de build apareça como falha de build.
          HF_SKIP_BUILD: '1'
        run: |
          set -o pipefail
          echo "## Publicação na Cloudflare" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `tee` para o log e para o resumo: quem abre a execução vê o
          # resultado sem precisar expandir o passo.
          bash scripts/cloudflare-setup.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # O e2e pergunta "o servidor mandou a página?". Esta etapa pergunta "a
      # página APARECE?" - que é outra coisa, e é a que o aluno faz.
      #
      # Entre as duas cabem um erro de script que apaga a tela, uma fonte ou um
      # chunk que não vem, uma chamada de API que trava o app num estado vazio.
      # Nenhum deles aparece num código 200, e todos chegam a quem abre como
      # "o site não funciona".
      #
      # Não derruba a publicação: o código já está no ar, e um vermelho aqui
      # faria alguém republicar sem saber o quê. O que importa é o relato.
      - name: A capa aparece num navegador?
        if: steps.guard.outputs.ok == 'true'
        continue-on-error: true
        run: |
          # O endereço sai do wrangler.toml, e não escrito aqui à mão: no dia
          # em que um domínio próprio entrar, esta etapa continuaria olhando
          # para o workers.dev e dizendo "a capa aparece" sobre o site antigo.
          export HF_BASE="$(grep -oP 'SITE_ORIGIN\s*=\s*"\K[^"]+' wrangler.toml)"
          echo "conferindo $HF_BASE"
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}" >/dev/null 2>&1
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium >/dev/null 2>&1
          {
            echo "## A capa num navegador de verdade"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node worker/browser-check.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # As capturas encerram a discussão quando o texto não basta.
      - name: Guardar as capturas
        if: always() && steps.guard.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: capturas-da-capa
          path: captura*.png
          if-no-files-found: ignore
          retention-days: 7

      # A conferência cria uma conta de teste no banco DE PRODUÇÃO - é o que
      # torna a verificação real. Sem esta limpeza, cada publicação deixa mais
      # uma linha para sempre, e em um ano a tabela de contas está cheia de
      # lixo que ninguém sabe de onde veio.
      #
      # O endereço usa o domínio .invalid, reservado pela RFC 2606: ele nunca
      # resolve e ninguém recebe e-mail nele. É o que torna seguro apagar por
      # padrão - um padrão capaz de casar com o e-mail de um aluno de verdade
      # seria uma forma criativa de apagar cliente.
      #
      # Apaga por PADRÃO de e-mail, e não só a conta desta execução: uma
      # publicação que falhou no meio não chegou a limpar a sua, e este passo
      # recolhe as que ficaram.
      #
      # `always()` porque a limpeza importa ainda mais quando a conferência
      # falhou. `continue-on-error` porque falhar ao limpar não pode
      # transformar uma publicação boa em vermelha.
      #
      # ⚠ TODA tabela que aponta para `accounts` precisa estar nesta lista,
      # ANTES do DELETE das contas. Uma que falte faz a limpeza inteira
      # falhar com "FOREIGN KEY constraint failed" e deixa a conta de teste
      # no banco de produção - foi o que aconteceu quando `password_resets`
      # nasceu. A lista de hoje: orders, entitlements, progress,
      # password_resets, email_verifications, registros_acesso, arrependimentos.
      # Ver worker/schema.sql.
      #
      # `access_log` não tem chave estrangeira e por isso não quebrava nada -
      # e por isso mesmo ficava para trás: cada publicação deixava meia dúzia
      # de linhas da conta de teste na trilha, para sempre. Vai junto.
      - name: Limpar as contas de teste
        if: always() && steps.guard.outputs.ok == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ALVO="SELECT id FROM accounts WHERE email LIKE 'hf-e2e-%@example.invalid'"
          # `email_verifications`, `registros_acesso` e `arrependimentos` apontam
          # para `accounts` (e `arrependimentos` para `orders`) e precisam sair
          # antes. Ficam num comando À PARTE, com `|| true`: a publicação aplica
          # o worker/schema.sql (scripts/cloudflare-setup.sh), mas esta etapa
          # roda com `always()`, também quando a publicação caiu ANTES de
          # aplicá-lo. Aí uma tabela nova pode ainda não existir, e um DELETE
          # numa tabela ausente derrubaria o comando inteiro abaixo.
          npx --yes wrangler@4.135.0 d1 execute hebraico-fluente --remote --command \
            "DELETE FROM email_verifications WHERE account_id IN ($ALVO);
             DELETE FROM registros_acesso    WHERE account_id IN ($ALVO);
             DELETE FROM arrependimentos     WHERE account_id IN ($ALVO);" || true
          npx --yes wrangler@4.135.0 d1 execute hebraico-fluente --remote --command \
            "DELETE FROM access_log       WHERE account_id IN ($ALVO);
             DELETE FROM payment_events   WHERE order_id IN (SELECT id FROM orders WHERE account_id IN ($ALVO));
             DELETE FROM orders           WHERE account_id IN ($ALVO);
             DELETE FROM entitlements     WHERE account_id IN ($ALVO);
             DELETE FROM progress         WHERE account_id IN ($ALVO);
             DELETE FROM password_resets  WHERE account_id IN ($ALVO);
             DELETE FROM accounts WHERE email LIKE 'hf-e2e-%@example.invalid'" \
            && echo "Contas de teste removidas." >> "$GITHUB_STEP_SUMMARY"
