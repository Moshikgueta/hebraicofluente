# Publica a PLATAFORMA no Cloudflare Workers.
#
# É esta a implantação de produção: o Worker serve o site, responde a /api/*,
# guarda contas e pedidos no D1 e fala com a Mercado Pago.
#
# A outra (deploy-app.yml → GitHub Pages) continua existindo e publica a mesma
# interface em MODO DEMONSTRAÇÃO, sem servidor. As duas não se atropelam
# porque a diferença é uma variável de build: NEXT_PUBLIC_PLATFORM_API.
#
# ── O QUE PRECISA EXISTIR ─────────────────────────────────────────────────
#
# Só isto, nos segredos DESTE repositório (Settings → Secrets and variables →
# Actions → aba Secrets):
#
#   CLOUDFLARE_API_TOKEN    modelo "Edit Cloudflare Workers" MAIS a permissão
#                           D1:Edit — sem ela o Worker sobe e o banco falha
#   CLOUDFLARE_ACCOUNT_ID   opcional hoje: o script deriva a conta do próprio
#                           token, e um id divergente é ignorado com aviso
#
# O resto é feito por scripts/cloudflare-setup.sh a cada execução: criar o
# banco, aplicar o esquema, gerar o SESSION_SECRET, publicar, acertar o
# SITE_ORIGIN e conferir o que subiu.
#
# Sem o token o job não roda: ele verifica, explica na tabela do resumo o que
# falta, e para — em vez de falhar no meio com um erro do wrangler.
#
# Para COBRAR, faltam dois segredos no painel da Cloudflare (Worker → Settings
# → Variables and Secrets, tipo Secret): MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET,
# com o webhook da Mercado Pago apontado para /api/pay/webhook. Sem eles o site
# funciona inteiro e só o checkout fica desligado, dizendo isso na tela.

name: Deploy platform to Cloudflare

on:
  push:
    # A mesma lista de deploy-app.yml. O repositório ainda não tem `main`, e um
    # workflow que só dispara num ramo inexistente nunca rodou uma vez sequer —
    # é o tipo de erro que só aparece quando alguém pergunta por que a
    # publicação não aconteceu.
    branches: [claude/practical-babbage-veufcz, main]
    paths:
      - 'app/**'
      - 'data/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'tools/export-content.mjs'
      # A publicação É este script agora (passo "Publicar e configurar"), então
      # mexer nele tem de disparar uma publicação — senão uma correção no
      # próprio caminho do deploy fica parada sem ninguém perceber.
      - 'scripts/cloudflare-setup.sh'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Não só "tem ou não tem": DIZ o que está errado.
      #
      # A tela de segredos do GitHub tem duas abas, *Secrets* e *Variables*, e
      # colar na errada é o engano mais comum que existe ali — o valor fica
      # salvo, visível, com o nome certo, e o workflow não enxerga. Como
      # `vars.X` e `secrets.X` são espaços separados, dá para detectar
      # exatamente esse caso e dizer o que fazer.
      #
      # Nada aqui imprime valor de segredo: só presença e comprimento, que é o
      # bastante para achar um token truncado na hora de colar.
      - name: Há credencial da Cloudflare?
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_AS_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
          ACCT_AS_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "## Credenciais"
            echo
            echo "| Segredo | Estado |"
            echo "|---|---|"
            if [ -n "$TOKEN" ]; then
              echo "| \`CLOUDFLARE_API_TOKEN\` | ✅ presente (${#TOKEN} caracteres) |"
            elif [ -n "$TOKEN_AS_VAR" ]; then
              echo "| \`CLOUDFLARE_API_TOKEN\` | ⚠️ está na aba **Variables**, não em **Secrets** |"
            else
              echo "| \`CLOUDFLARE_API_TOKEN\` | ❌ ausente |"
            fi
            if [ -n "$ACCT" ]; then
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ✅ presente (${#ACCT} caracteres) |"
            elif [ -n "$ACCT_AS_VAR" ]; then
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ⚠️ está na aba **Variables**, não em **Secrets** |"
            else
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ❌ ausente |"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$TOKEN_AS_VAR" ] || [ -n "$ACCT_AS_VAR" ]; then
            {
              echo "A tela de segredos tem duas abas. O valor foi colado em **Variables**,"
              echo "e o workflow lê **Secrets**. Vá em Settings → Secrets and variables →"
              echo "Actions → aba **Secrets** → *New repository secret*, e cole lá."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::A credencial está na aba Variables. Mova para Secrets."
          fi

          # Um token da Cloudflare tem 40 caracteres; o Account ID, 32 hex. Um
          # valor muito curto quase sempre é cópia pela metade.
          if [ -n "$TOKEN" ] && [ "${#TOKEN}" -lt 20 ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN tem só ${#TOKEN} caracteres — parece truncado."
          fi
          if [ -n "$ACCT" ] && [ "${#ACCT}" -ne 32 ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID tem ${#ACCT} caracteres; o esperado são 32."
          fi

          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem CLOUDFLARE_API_TOKEN — publicação pulada. Ver o resumo desta execução."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: npm ci

      # Os testes são o portão. A regra de ordem em particular: uma versão
      # quebrada que ainda assim publicasse poria uma lição na frente de um
      # aluno com uma letra que ele não aprendeu. E agora também o que decide
      # preço e acesso (tests/platform.test.ts, tests/worker.test.ts).
      - name: Test
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        run: npm test

      # NEXT_PUBLIC_PLATFORM_API=worker é o que faz o app falar com /api/* em
      # vez do adaptador local. Sem isto, a plataforma publicada guardaria
      # contas no navegador de cada visitante — com uma tarja dizendo isso,
      # mas ainda assim errado.
      - name: Build (modo plataforma)
        if: steps.guard.outputs.ok == 'true'
        working-directory: app
        env:
          NEXT_PUBLIC_PLATFORM_API: worker
        run: npm run build

      # Publicar É o script de configuração, e não um `wrangler deploy` seco.
      #
      # A diferença importa: um deploy seco pressupõe que o banco existe, que o
      # database_id no wrangler.toml é o certo, que o esquema foi aplicado e
      # que o SESSION_SECRET está definido — e falha de forma obscura quando
      # qualquer um desses pressupostos não vale. O script CONFERE cada um e
      # cria o que faltar. Resultado: a primeira publicação de uma conta nova
      # funciona sem ninguém abrir um terminal.
      #
      # Ele é idempotente, então nas publicações seguintes os passos 1–4 só
      # confirmam o que já existe e seguem adiante.
      #
      # O CLOUDFLARE_API_TOKEN vai no ambiente porque o wrangler o lê de lá
      # sozinho — é assim que a mesma linha serve à máquina de alguém (onde a
      # credencial vem do `wrangler login`) e ao CI.
      - name: Publicar e configurar
        id: deploy
        if: steps.guard.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # O build já aconteceu no passo anterior, com o cache do npm, para
          # que uma falha de build apareça como falha de build.
          HF_SKIP_BUILD: '1'
        run: |
          set -o pipefail
          echo "## Publicação na Cloudflare" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `tee` para o log e para o resumo: quem abre a execução vê o
          # resultado sem precisar expandir o passo.
          bash scripts/cloudflare-setup.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # A conferência cria uma conta de teste no banco DE PRODUÇÃO — é o que
      # torna a verificação real. Sem esta limpeza, cada publicação deixa mais
      # uma linha para sempre, e em um ano a tabela de contas está cheia de
      # lixo que ninguém sabe de onde veio.
      #
      # O endereço usa o domínio .invalid, reservado pela RFC 2606: ele nunca
      # resolve e ninguém recebe e-mail nele. É o que torna seguro apagar por
      # padrão — um padrão capaz de casar com o e-mail de um aluno de verdade
      # seria uma forma criativa de apagar cliente.
      #
      # Apaga por PADRÃO de e-mail, e não só a conta desta execução: uma
      # publicação que falhou no meio não chegou a limpar a sua, e este passo
      # recolhe as que ficaram.
      #
      # `always()` porque a limpeza importa ainda mais quando a conferência
      # falhou. `continue-on-error` porque falhar ao limpar não pode
      # transformar uma publicação boa em vermelha.
      - name: Limpar as contas de teste
        if: always() && steps.guard.outputs.ok == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 d1 execute hebraico-fluente --remote --command \
            "DELETE FROM orders WHERE account_id IN (SELECT id FROM accounts WHERE email LIKE 'hf-e2e-%@example.invalid');
             DELETE FROM entitlements WHERE account_id IN (SELECT id FROM accounts WHERE email LIKE 'hf-e2e-%@example.invalid');
             DELETE FROM accounts WHERE email LIKE 'hf-e2e-%@example.invalid'" \
            && echo "Contas de teste removidas." >> "$GITHUB_STEP_SUMMARY"
