# Hebraico Fluente — Cloudflare Worker.
#
# O Worker roda ANTES dos arquivos estáticos e faz três coisas: responde a
# /api/*, aplica o portão das rotas pagas e entrega o export do Next.
#
# Publicar:
#   cd app && NEXT_PUBLIC_PLATFORM_API=worker npm run build   # gera app/out
#   npx wrangler deploy
#
# Criar o banco, uma vez:
#   npx wrangler d1 create hebraico-fluente
#   # cole o database_id devolvido abaixo
#   npx wrangler d1 execute hebraico-fluente --file=worker/schema.sql --remote

name = "hebraico-fluente"
main = "worker/src/worker.js"
compatibility_date = "2026-09-01"

[assets]
# O export estático do Next. `run_worker_first` é obrigatório: sem ele os
# arquivos são servidos antes de o portão rodar, e a aula sai sem cookie.
directory = "./app/out"
binding = "ASSETS"
run_worker_first = true
# O 404 do próprio site, com o layout do site — e não a página crua do
# servidor.
not_found_handling = "404-page"

# No plano GRATUITO são 10 ms de CPU por requisição, e não há o que
# configurar. No Workers Paid, descomente para permitir o PBKDF2 forte
# (ver PBKDF2_ITERATIONS em [vars]).
# [limits]
# cpu_ms = 200

[[d1_databases]]
binding = "DB"
database_name = "hebraico-fluente"
database_id = "af5fad4b-8a1d-4512-8024-f13d698ddd73"

# A varredura de pagamentos pendentes. O webhook da Mercado Pago é assinado e
# confiável, e mesmo assim pode não chegar — ver worker/src/reconcile.js.
[triggers]
crons = ["*/5 * * * *"]

# ⚠ REGRA DE PROPRIEDADE — cada nome de variável vive em UM lugar só.
#
#   · Os nomes abaixo pertencem a ESTE ARQUIVO. Nunca os acrescente também
#     como variável ou segredo no painel: cada publicação reaplica esta lista,
#     e um segredo de mesmo nome no painel faz a publicação falhar.
#
#   · SESSION_SECRET, MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET pertencem ao PAINEL
#     (Worker → Settings → Variables and Secrets, tipo Secret) e nunca podem
#     aparecer aqui. Ver .env.example.
#
# PREÇO NÃO ESTÁ AQUI, de propósito: ele vem de data/courses.json, lido pelo
# próprio Worker (worker/src/lib/catalog.js). Um preço em dois lugares vira
# dois preços.
[vars]
# Origem absoluta do site. O cron não tem requisição de onde deduzi-la.
SITE_ORIGIN = "https://hebraico-fluente.moshikg10.workers.dev"
# "1" usa o checkout de teste da Mercado Pago (não cobra nada). Em produção,
# "0" — e a diferença é visível: o sandbox manda o comprador para uma tela
# que não cobra, o que passa despercebido por semanas se ficar ligado sem querer.
MP_SANDBOX = "1"
# Custo do hash de senha. O padrão do código (25.000) foi dimensionado para o
# limite de 10 ms de CPU do plano GRATUITO — acima disso o Worker é morto no
# meio do cálculo e toda conta/login devolve 500.
#
# No Workers Paid, descomente as duas linhas abaixo e o bloco [limits] acima
# para chegar ao valor recomendado pelo OWASP. Ninguém é deslogado: cada conta
# guarda as iterações com que foi gravada, e se atualiza sozinha no primeiro
# login. Ver a nota em worker/src/lib/crypto.js.
# PBKDF2_ITERATIONS = "310000"
